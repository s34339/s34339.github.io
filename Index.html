<!DOCTYPE html>

<style>
/* ===== RESET & BACKGROUND ===== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100vh; font-family: Tahoma, Arial, sans-serif; color: #3f5a35; position: relative; overflow-x: hidden; }
body {
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.85), transparent 38%),
    radial-gradient(circle at 15% 30%, rgba(255,214,236,.55), transparent 30%),
    radial-gradient(circle at 85% 20%, rgba(200,240,170,.55), transparent 32%),
    radial-gradient(circle at 25% 80%, rgba(255,200,230,.4), transparent 30%),
    radial-gradient(circle at 80% 75%, rgba(190,235,160,.45), transparent 32%),
    linear-gradient(180deg, #fff6e9 0%, #ffe9f2 22%, #eafcd8 55%, #d6f5c4 80%, #bdeeae 100%);
}
body .garden-sun{position:fixed;width:220px;height:220px;border-radius:50%;top:-80px;right:-60px;z-index:0;pointer-events:none;background:radial-gradient(circle, #fff6c8 0%, #ffe98a 55%, transparent 75%);box-shadow:0 0 60px rgba(255,222,120,.55);animation:sunPulse 6s ease-in-out infinite;}
@keyframes sunPulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
body .garden-grass{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:1;pointer-events:none;opacity:.5;background:repeating-linear-gradient(75deg, #9fdb7a 0 10px, #b6e893 10px 20px);-webkit-mask-image:repeating-conic-gradient(from 0deg,#000 0deg 8deg,transparent 8deg 16deg);mask-image:repeating-conic-gradient(from 0deg,#000 0deg 8deg,transparent 8deg 16deg);}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .55;
  background: linear-gradient(110deg, transparent 15%, rgba(255,255,255,.35) 30%, transparent 42%), linear-gradient(70deg, transparent 30%, rgba(255,225,245,.3) 45%, transparent 58%), linear-gradient(100deg, transparent 50%, rgba(210,240,175,.3) 65%, transparent 78%);
  background-size: 250% 100%, 220% 100%, 250% 100%; animation: sparkleShift 10s ease-in-out infinite alternate;
}
@keyframes sparkleShift { 0%{transform:translateX(-50px);opacity:.3} 50%{transform:translateX(20px);opacity:.6} 100%{transform:translateX(60px);opacity:.85} }

/* ===== DECORATIONS ===== */
.glitter { position:fixed; width:4px; height:4px; border-radius:50%; background:white; z-index:2; pointer-events:none; box-shadow:0 0 5px white,0 0 12px #ffc6e6,0 0 20px #c9eda0; animation:glitterMove 4s ease-in-out infinite, glitterBlink 1.5s ease-in-out infinite alternate; }
@keyframes glitterMove { 0%,100%{transform:translateY(20px)} 50%{transform:translateY(-40px)} }
@keyframes glitterBlink { 0%{opacity:.2;transform:scale(.5)} 100%{opacity:1;transform:scale(1.5)} }
.diamond { position:fixed; width:22px; height:22px; transform:rotate(45deg); border-radius:4px; z-index:3; pointer-events:none; background:linear-gradient(135deg,white 0%,#ffd6ec 25%,#c9eda0 45%,white 65%,#ffc2e2 85%,white 100%); box-shadow:0 0 8px white,0 0 18px #ffcce8,0 0 35px #c9eda0; animation:diamondFloat 6s ease-in-out infinite, diamondGlow 2s ease-in-out infinite alternate; }
.diamond.small{width:12px;height:12px;} .diamond.big{width:32px;height:32px;}
@keyframes diamondFloat{0%{transform:translateY(30px) rotate(45deg)}50%{transform:translateY(-70px) rotate(135deg)}100%{transform:translateY(30px) rotate(225deg)}}
@keyframes diamondGlow{from{opacity:.3;filter:brightness(.8)}to{opacity:1;filter:brightness(1.8)}}
.d1{left:6%;top:20%} .d2{left:18%;top:70%;animation-delay:1s} .d3{left:30%;top:15%;animation-delay:2s} .d4{right:8%;top:20%;animation-delay:1.5s} .d5{right:17%;top:65%;animation-delay:3s} .d6{left:50%;top:80%;animation-delay:2.5s}
.bubble { position:fixed; bottom:-60px; width:20px; height:20px; border-radius:50%; border:2px solid rgba(255,255,255,.8); background:rgba(255,255,255,.12); z-index:2; pointer-events:none; box-shadow:inset 2px 2px 5px white,0 0 10px rgba(255,200,230,.6); animation:bubbleUp 9s linear infinite; }
@keyframes bubbleUp{0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}15%{opacity:.8}50%{transform:translateY(-50vh) translateX(35px) scale(1)}100%{transform:translateY(-115vh) translateX(-30px) scale(1.2);opacity:0}}
.b1{left:7%} .b2{left:20%;animation-delay:3s;width:12px;height:12px} .b3{left:35%;animation-delay:5s;width:28px;height:28px} .b4{left:55%;animation-delay:2s} .b5{left:70%;animation-delay:6s;width:13px;height:13px} .b6{left:85%;animation-delay:4s;width:25px;height:25px}
.wave { position:fixed; left:-15%; bottom:-120px; width:130%; height:300px; border-radius:50% 50% 0 0; z-index:4; pointer-events:none; background:linear-gradient(180deg, rgba(255,214,236,.6), rgba(255,170,215,.7)); box-shadow:0 -20px 50px rgba(255,200,230,.4); animation:waveMove 5s ease-in-out infinite; }
.wave.two{bottom:-155px;height:320px;opacity:.7;background:linear-gradient(180deg,rgba(200,235,150,.55),rgba(150,210,110,.6));animation:waveMove 7s ease-in-out infinite reverse}
.wave.three{bottom:-200px;height:350px;opacity:.5;background:rgba(255,205,232,.6);animation:waveMove 9s ease-in-out infinite}
@keyframes waveMove{0%,100%{transform:translateX(-5%) rotate(1deg)}50%{transform:translateX(5%) rotate(-2deg)}}
.shimmer-overlay { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.8; background-image:radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1.4px), radial-gradient(circle, rgba(255,214,236,.8) 1px, transparent 1.4px), radial-gradient(circle, rgba(200,235,165,.8) 1px, transparent 1.4px); background-size:90px 90px,130px 130px,160px 160px; background-position:0 0,30px 60px,70px 20px; animation:shimmerDrift 9s linear infinite; }
@keyframes shimmerDrift{0%{background-position:0 0,30px 60px,70px 20px}100%{background-position:90px 90px,-100px 190px,-90px 180px}}
.star-sparkle{position:fixed;z-index:2;pointer-events:none;color:white;line-height:1;text-shadow:0 0 6px white,0 0 14px #ffd6ec,0 0 22px #c9eda0;animation:starTwinkle 2.6s ease-in-out infinite, starSpin 7s linear infinite;}
@keyframes starTwinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.25)}}
@keyframes starSpin{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(25deg)}}
.floaty-sticker{position:fixed;z-index:2;pointer-events:none;line-height:1;opacity:.9;filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 12px rgba(255,214,236,.6));animation:stickerFloat 8s ease-in-out infinite;}
@keyframes stickerFloat{0%{transform:translateY(0) translateX(0) rotate(-6deg)}25%{transform:translateY(-18px) translateX(10px) rotate(4deg)}50%{transform:translateY(6px) translateX(-8px) rotate(-4deg)}75%{transform:translateY(-12px) translateX(6px) rotate(6deg)}100%{transform:translateY(0) translateX(0) rotate(-6deg)}}
.emoji-fall{position:fixed;top:-8%;z-index:3;line-height:1;pointer-events:none;filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 10px rgba(255,214,236,.6));animation-name:emojiFallA;animation-timing-function:linear;animation-iteration-count:infinite;}
.emoji-fall.sway-b{animation-name:emojiFallB} .emoji-fall.sway-c{animation-name:emojiFallC}
@keyframes emojiFallA{0%{transform:translateY(-10vh) translateX(0) rotate(0deg);opacity:0}8%{opacity:.95}50%{transform:translateY(55vh) translateX(35px) rotate(180deg)}92%{opacity:.95}100%{transform:translateY(115vh) translateX(-15px) rotate(360deg);opacity:0}}
@keyframes emojiFallB{0%{transform:translateY(-10vh) translateX(0) rotate(0deg);opacity:0}8%{opacity:.95}50%{transform:translateY(55vh) translateX(-40px) rotate(-180deg)}92%{opacity:.95}100%{transform:translateY(115vh) translateX(20px) rotate(-360deg);opacity:0}}
@keyframes emojiFallC{0%{transform:translateY(-10vh) translateX(0) rotate(0deg);opacity:0}8%{opacity:.9}25%{transform:translateY(20vh) translateX(28px) rotate(90deg)}50%{transform:translateY(55vh) translateX(-24px) rotate(180deg)}75%{transform:translateY(85vh) translateX(24px) rotate(270deg)}92%{opacity:.9}100%{transform:translateY(115vh) translateX(-10px) rotate(360deg);opacity:0}}

/* ===== LAYOUT ===== */
.page-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; z-index: 10; position: relative; }
.cover { position:relative; width:min(1050px,92%); text-align:center; background:linear-gradient(145deg, rgba(255,255,255,.96), rgba(255,240,248,.94)); border:4px solid white; box-shadow:0 30px 80px rgba(120,150,80,.3),0 0 40px rgba(255,255,255,.6); backdrop-filter:blur(12px); padding:60px 35px; min-height:700px; border-radius:60px; animation:cardGlowPulse 3.2s ease-in-out infinite; }
@keyframes cardGlowPulse{ 0%,100%{box-shadow:0 30px 80px rgba(120,150,80,.3),0 0 40px rgba(255,255,255,.65),0 0 55px rgba(255,182,217,.5);} 50%{box-shadow:0 30px 90px rgba(120,150,80,.35),0 0 65px rgba(255,255,255,.95),0 0 95px rgba(200,235,165,.75);} }
.cover::before{content:"";position:absolute;inset:-14px;border:5px dotted #ffb3d9;border-radius:76px;pointer-events:none;opacity:.8;animation:dotPulse 2.6s ease-in-out infinite;}
.cover::after{content:"";position:absolute;inset:-25px;border:3px dotted #cdeeae;border-radius:86px;pointer-events:none;opacity:.6;animation:dotPulse 2.6s ease-in-out infinite .4s;}
@keyframes dotPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.015)}}
.top-bow{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:46px;z-index:7;pointer-events:none;filter:drop-shadow(0 0 6px rgba(255,255,255,.95)) drop-shadow(0 0 14px rgba(255,214,236,.8));animation:bowWiggle 3s ease-in-out infinite;}
@keyframes bowWiggle{0%,100%{transform:translateX(-50%) rotate(-8deg)}50%{transform:translateX(-50%) rotate(8deg)}}
.side-trim{position:absolute;top:12%;height:76%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;z-index:6;pointer-events:none;}
.side-trim.left{left:-22px;} .side-trim.right{right:-22px;}
.side-trim span{font-size:22px;filter:drop-shadow(0 0 5px rgba(255,255,255,.9)) drop-shadow(0 0 10px rgba(255,214,236,.7));animation:trimSway 2.8s ease-in-out infinite;}
.side-trim span:nth-child(2n){animation-delay:.4s} .side-trim span:nth-child(3n){animation-delay:.8s}
@keyframes trimSway{0%,100%{transform:translateX(-4px) rotate(-6deg)}50%{transform:translateX(4px) rotate(6deg)}}
.bottom-flower{position:absolute;bottom:-18px;font-size:30px;z-index:6;pointer-events:none;filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 12px rgba(200,230,165,.7));animation:cornerWiggle 3.2s ease-in-out infinite;}
.bottom-flower.left{left:-14px;} .bottom-flower.right{right:-14px;animation-delay:.6s;}
@keyframes cornerWiggle{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.12)}}

/* ===== PHOTO & TEXT ===== */
.photo-frame{display:inline-block;padding:10px;border-radius:50%;background:linear-gradient(135deg,#ffd6ec,#c9eda0,#ffd6ec);background-size:300% 300%;box-shadow:0 0 15px white,0 0 35px #ffc6e6,0 0 55px rgba(160,220,120,.7);animation:frameLight 4s ease infinite;}
@keyframes frameLight{0%{background-position:0% 50%;box-shadow:0 0 15px white,0 0 30px #ffc6e6}50%{background-position:100% 50%;box-shadow:0 0 20px white,0 0 45px #a3d977}100%{background-position:0% 50%;box-shadow:0 0 15px white,0 0 30px #ffc6e6}}
.photo-frame img{display:block;width:210px;height:210px;object-fit:cover;border-radius:50%;border:7px solid white;}
h1{margin:25px 0 5px;font-size:clamp(42px,8vw,75px);color:#ff8fc2;letter-spacing:3px;text-shadow:3px 3px white,0 0 20px rgba(160,220,120,.6);}
.name{font-size:28px;font-weight:bold;color:#5a9a45;}
.kawaii-badge{display:inline-block;margin-top:8px;padding:6px 18px;font-size:13px;font-weight:bold;letter-spacing:1px;color:#ff6fb5;background:rgba(255,255,255,.8);border:2px dashed #ffb6d9;border-radius:20px;animation:badgeWiggle 3s ease-in-out infinite;}
@keyframes badgeWiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.tagline{margin-top:12px;font-size:18px;line-height:1.8;color:#4f7a3f;}

/* ===== MENU ===== */
.menu{margin-top:45px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;}
.menu a{padding:25px 15px;text-decoration:none;color:#3f6b3a;border-radius:28px;font-weight:bold;display:block;cursor:pointer;background:linear-gradient(135deg,#ffb3d9,#ffe3f0,#c9eda0);background-size:200% 200%;box-shadow:0 10px 25px rgba(255,180,220,.45);transition:transform .35s, box-shadow .35s;animation:menuShine 5s ease infinite;}
@keyframes menuShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.menu a:nth-child(even){background:linear-gradient(135deg,#cdeeae,#eefbdc,#ffd6ec);background-size:200% 200%;box-shadow:0 10px 25px rgba(160,210,255,.45);}
.menu a:hover{transform:translateY(-10px) scale(1.04);box-shadow:0 20px 40px rgba(255,200,230,.6);}
.menu-icon{display:block;font-size:36px;margin-bottom:8px;animation:iconBounce 2.4s ease-in-out infinite;}
@keyframes iconBounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.menu-title{font-size:18px;}
.menu-small{display:block;margin-top:6px;font-size:12px;opacity:.85;}

/* ===== NAV BUTTONS ===== */
.nav-btn{position:fixed;top:50%;transform:translateY(-50%);z-index:50;width:56px;height:56px;border-radius:50%;border:3px solid white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;color:#ff6fb5;background:linear-gradient(135deg,#ffe3f0,#eefbdc);box-shadow:0 8px 20px rgba(255,180,220,.5),0 0 15px rgba(255,255,255,.8);transition:.25s;animation:navPulse 2.4s ease-in-out infinite;text-decoration:none;}
.nav-btn:hover{transform:translateY(-50%) scale(1.12);box-shadow:0 12px 26px rgba(255,180,220,.65);}
.nav-btn.next{right:22px;}
@keyframes navPulse{0%,100%{box-shadow:0 8px 20px rgba(255,180,220,.5),0 0 15px rgba(255,255,255,.8)}50%{box-shadow:0 8px 24px rgba(255,180,220,.7),0 0 22px rgba(200,235,165,.9)}}

.cursor-sparkle{position:fixed;z-index:260;pointer-events:none;font-size:16px;line-height:1;animation:cursorSparkleFade .8s ease-out forwards;}
@keyframes cursorSparkleFade{0%{transform:translate(-50%,-50%) scale(0.4) rotate(0deg);opacity:1;}100%{transform:translate(-50%,-50%) scale(1.3) rotate(120deg) translateY(-24px);opacity:0;}}
@media(max-width:600px){ .cover{padding:45px 18px;} .photo-frame img{width:165px;height:165px;} .menu{grid-template-columns:1fr;} .nav-btn{width:46px;height:46px;font-size:19px;right:12px;} }
</style>
</head>

<script>
  const sparkleChars = ['✦','✨','🌷','⭐'];
  let lastSparkleTime = 0;
  document.addEventListener('mousemove', (e) => {
    const now = Date.now();
    if(now - lastSparkleTime < 180) return;
    lastSparkleTime = now;
    const s = document.createElement('span');
    s.className = 'cursor-sparkle';
    s.textContent = sparkleChars[Math.floor(Math.random()*sparkleChars.length)];
    s.style.left = e.clientX + 'px';
    s.style.top = e.clientY + 'px';
    s.style.color = Math.random() > 0.5 ? '#ff8fc2' : '#5a9a45';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 820);
  });
</script>
