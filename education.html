<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>education.html | Portfolio</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100vh; font-family: Tahoma, Arial, sans-serif; color: #3f5a35; position: relative; overflow-x: hidden; }
body {
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.85), transparent 38%),
    radial-gradient(circle at 15% 30%, rgba(255,214,236,.55), transparent 30%),
    radial-gradient(circle at 85% 20%, rgba(200,240,170,.55), transparent 32%),
    radial-gradient(circle at 25% 80%, rgba(255,200,230,.4), transparent 30%),
    radial-gradient(circle at 80% 75%, rgba(190,235,160,.45), transparent 32%),
    linear-gradient(180deg, #fff6e9 0%, #ffe9f2 22%, #eafcd8 55%, #d6f5c4 80%, #bdeeae 100%);
}
body .garden-sun{position:fixed;width:220px;height:220px;border-radius:50%;top:-80px;right:-60px;z-index:0;pointer-events:none;background:radial-gradient(circle, #fff6c8 0%, #ffe98a 55%, transparent 75%);box-shadow:0 0 60px rgba(255,222,120,.55);animation:sunPulse 6s ease-in-out infinite;}
@keyframes sunPulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
body .garden-grass{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:1;pointer-events:none;opacity:.5;background:repeating-linear-gradient(75deg, #9fdb7a 0 10px, #b6e893 10px 20px);-webkit-mask-image:repeating-conic-gradient(from 0deg,#000 0deg 8deg,transparent 8deg 16deg);mask-image:repeating-conic-gradient(from 0deg,#000 0deg 8deg,transparent 8deg 16deg);}

.page-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; z-index: 10; position: relative; }
.page-card{position:relative;width:min(1050px,92%);text-align:left;background:linear-gradient(145deg, rgba(255,255,255,.96), rgba(255,240,248,.94));border:4px solid white;box-shadow:0 30px 80px rgba(120,150,80,.3),0 0 40px rgba(255,255,255,.6);backdrop-filter:blur(12px);padding:50px 40px;min-height:480px;border-radius:45px;animation:cardGlowPulse 3.2s ease-in-out infinite;}
@keyframes cardGlowPulse{0%,100%{box-shadow:0 30px 80px rgba(120,150,80,.3),0 0 40px rgba(255,255,255,.65),0 0 55px rgba(255,182,217,.5);}50%{box-shadow:0 30px 90px rgba(120,150,80,.35),0 0 65px rgba(255,255,255,.95),0 0 95px rgba(200,235,165,.75);}}
h2.page-title{margin:0 0 30px;font-size:clamp(30px,6vw,46px);color:#ff8fc2;letter-spacing:2px;text-align:center;text-shadow:2px 2px white,0 0 16px rgba(160,220,120,.5);}

.timeline{display:flex;flex-direction:column;gap:20px;margin-top:10px;}
.timeline-item{padding:22px 26px;border-radius:28px;background:rgba(255,255,255,.7);border:2px solid #ffe3f0;box-shadow:0 8px 20px rgba(255,190,220,.3);display:flex;align-items:center;gap:20px;}
.timeline-item .level{font-size:14px;font-weight:bold;color:#ff8fc2;letter-spacing:1px;}
.timeline-item .school{margin-top:6px;font-size:19px;font-weight:bold;color:#3f5a35;}
.timeline-item .tl-icon{flex-shrink:0;font-size:36px;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);border:2px solid #ffd6ec;}
.timeline-item .tl-content{flex:1;}
.timeline-item .tl-grade{margin-top:6px;color:#ff8fc2;font-weight:bold;}

.back-link{display:inline-block;margin-bottom:20px;padding:10px 26px;text-decoration:none;font-weight:bold;color:#3f6b3a;background:linear-gradient(135deg,#ffe3f0,#eefbdc);border-radius:30px;box-shadow:0 6px 16px rgba(255,180,220,.4);transition:.3s;}
.back-link:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(255,180,220,.55);}

.nav-btn{position:fixed;top:50%;transform:translateY(-50%);z-index:50;width:56px;height:56px;border-radius:50%;border:3px solid white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;color:#ff6fb5;background:linear-gradient(135deg,#ffe3f0,#eefbdc);box-shadow:0 8px 20px rgba(255,180,220,.5);transition:.25s;text-decoration:none;}
.nav-btn:hover{transform:translateY(-50%) scale(1.12);}
.nav-btn.prev{left:22px;} .nav-btn.next{right:22px;}

.cursor-sparkle{position:fixed;z-index:260;pointer-events:none;font-size:16px;line-height:1;animation:cursorSparkleFade .8s ease-out forwards;}
@keyframes cursorSparkleFade{0%{transform:translate(-50%,-50%) scale(0.4) rotate(0deg);opacity:1;}100%{transform:translate(-50%,-50%) scale(1.3) rotate(120deg) translateY(-24px);opacity:0;}}
@media(max-width:600px){ .page-card{padding:45px 18px;} .nav-btn{width:46px;height:46px;font-size:19px;} .nav-btn.prev{left:12px;} .nav-btn.next{right:12px;} }
</style>
</head>
<body>

<div class="garden-sun"></div>
<div class="garden-grass"></div>

<div class="page-wrapper">
  <div class="page-card">
    <a href="index.html" class="back-link">🏠 กลับหน้าหลัก</a>
    <h2 class="page-title">ประวัติการศึกษา (EDUCATION)</h2>
    <div class="timeline">
      <div class="timeline-item"><div class="tl-icon">🏫</div>
        <div class="tl-content"><div class="level">ประถมศึกษา (ป.)</div><div class="school">โรงเรียนวัฒนดรุณวิทย์</div></div></div>
      <div class="timeline-item"><div class="tl-icon">📘</div>
        <div class="tl-content"><div class="level">มัธยมศึกษาตอนต้น (ม.ต้น)</div><div class="school">โรงเรียนบ้านบึง"อุตสาหกรรมนุเคราะห์"</div><div class="tl-grade">เกรดเฉลี่ย 3.99</div></div></div>
      <div class="timeline-item"><div class="tl-icon">🎓</div>
        <div class="tl-content"><div class="level">มัธยมศึกษาตอนปลาย (ม.ปลาย)</div><div class="school">โรงเรียนบ้านบึง"อุตสาหกรรมนุเคราะห์"</div><div class="tl-grade">เกรดเฉลี่ย 4.00</div></div></div>
    </div>
  </div>
</div>

<a href="profile.html" class="nav-btn prev" aria-label="ก่อนหน้า">‹</a>
<a href="study.html" class="nav-btn next" aria-label="ถัดไป">›</a>

<script>
  const sparkleChars = ['✦','✨','🌷','⭐'];
  let lastSparkleTime = 0;
  document.addEventListener('mousemove', (e) => {
    const now = Date.now();
    if(now - lastSparkleTime < 180) return;
    lastSparkleTime = now;
    const s = document.createElement('span');
    s.className = 'cursor-sparkle';
    s.textContent = sparkleChars[Math.floor(Math.random()*sparkleChars.length)];
    s.style.left = e.clientX + 'px';
    s.style.top = e.clientY + 'px';
    s.style.color = Math.random() > 0.5 ? '#ff8fc2' : '#5a9a45';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 820);
  });
</script>
</body>
</html>
