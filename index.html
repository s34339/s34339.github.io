<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแนะนำตัวของฉัน 🌷</title>

<style>
html { overflow-x: hidden; }
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.35) 0 60px, transparent 61px),
        radial-gradient(circle at 88% 10%, rgba(255,255,255,0.25) 0 40px, transparent 41px),
        linear-gradient(160deg, #fff6e9 0%, #ffe9f2 30%, #eafcd8 65%, #d6f5c4 100%);
    background-size: 100% 100%, 100% 100%, 300% 300%;
    animation: bgDrift 16s ease-in-out infinite;
    color: #5a7a3f;
    text-align: center;
    padding: 50px 20px;
    font-family: "Tahoma", "Arial", sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
}
@keyframes bgDrift {
    0%,100% { background-position: 0 0, 0 0, 0% 50%; }
    50% { background-position: 0 0, 0 0, 100% 50%; }
}

/* หญ้าเบา ๆ ด้านล่างจอ */
body::after {
    content: "";
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 90px;
    z-index: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        75deg,
        #9fdb7a 0 10px,
        #b6e893 10px 20px
    );
    -webkit-mask-image: repeating-conic-gradient(from 0deg, #000 0deg 8deg, transparent 8deg 16deg);
    mask-image: repeating-conic-gradient(from 0deg, #000 0deg 8deg, transparent 8deg 16deg);
    opacity: .55;
}

/* ดวงอาทิตย์อ่อนโยนมุมบน */
body::before {
    content: "";
    position: fixed;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    top: -80px;
    right: -60px;
    background: radial-gradient(circle, #fff6c8 0%, #ffe98a 55%, transparent 75%);
    box-shadow: 0 0 60px rgba(255,222,120,.6);
    pointer-events: none;
    animation: sunPulse 6s ease-in-out infinite;
}
@keyframes sunPulse {
    0%,100% { opacity: .8; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
}

/* =========================
   🌼 ดอกไม้ลอยขึ้นแทนฟองอากาศ
========================= */
.bubble {
    position: fixed;
    bottom: -60px;
    font-size: 22px;
    pointer-events: none;
    z-index: 1;
    filter: drop-shadow(0 0 4px rgba(255,255,255,.7));
    animation: bubbleRise 11s linear infinite;
}
@keyframes bubbleRise {
    0% { transform: translateY(0) translateX(0) rotate(0deg) scale(.7); opacity: 0; }
    12% { opacity: .9; }
    50% { transform: translateY(-55vh) translateX(25px) rotate(180deg) scale(1); }
    100% { transform: translateY(-115vh) translateX(-20px) rotate(360deg) scale(1.1); opacity: 0; }
}

/* =========================
   🦋 สติกเกอร์ลอยตกแต่ง
========================= */
.floaty {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    line-height: 1;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.85));
    animation: floatySway 7s ease-in-out infinite;
}
@keyframes floatySway {
    0% { transform: translateY(0) translateX(0) rotate(-6deg); }
    25% { transform: translateY(-16px) translateX(8px) rotate(4deg); }
    50% { transform: translateY(6px) translateX(-8px) rotate(-4deg); }
    75% { transform: translateY(-10px) translateX(6px) rotate(6deg); }
    100% { transform: translateY(0) translateX(0) rotate(-6deg); }
}

/* =========================
   🌸 ดอกไม้ตัวเล็กเรืองแสงลอยไปมา (แทนไข่มุก)
========================= */
.pearl {
    position: fixed;
    width: 20px;
    height: 20px;
    z-index: 2;
    font-size: 18px;
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.9));
    animation: floatGem 7s ease-in-out infinite, sparkle 2s ease-in-out infinite;
}
.pearl.small { font-size: 12px; }
.pearl.big { font-size: 26px; }

@keyframes floatGem {
    0% { transform: translateY(30px) rotate(-10deg); }
    50% { transform: translateY(-50px) rotate(10deg); }
    100% { transform: translateY(30px) rotate(-10deg); }
}
@keyframes sparkle {
    0%,100% { opacity: 0.5; filter: brightness(0.9); }
    50% { opacity: 1; filter: brightness(1.3); }
}

.pearl1 { left: 8%;  top: 15%; animation-delay: 0s; }
.pearl2 { left: 20%; top: 70%; animation-delay: 1s; }
.pearl3 { left: 35%; top: 10%; animation-delay: 2s; }
.pearl4 { left: 55%; top: 80%; animation-delay: 3s; }
.pearl5 { left: 72%; top: 20%; animation-delay: 1.5s; }
.pearl6 { left: 88%; top: 55%; animation-delay: 2.5s; }
.pearl7 { left: 15%; top: 45%; animation-delay: 4s; }
.pearl8 { left: 80%; top: 85%; animation-delay: 3.5s; }
.pearl9 { left: 45%; top: 90%; animation-delay: 1s; }
.pearl10{ left: 93%; top: 12%; animation-delay: 4.5s; }

/* =========================
   🌷 กรอบตกแต่งรอบการ์ด
========================= */
.frame-wrap {
    position: relative;
    max-width: 540px;
    margin: 50px auto;
    z-index: 9;
}
.frame-wrap::before {
    content: "";
    position: absolute;
    inset: -14px;
    border: 3px dashed rgba(255,255,255,.9);
    border-radius: 45px;
    pointer-events: none;
    box-shadow: 0 0 20px rgba(255,255,255,.5);
    animation: framePulse 2.6s ease-in-out infinite;
}
.frame-wrap::after {
    content: "";
    position: absolute;
    inset: -27px;
    border: 2px dotted rgba(255,182,120,.65);
    border-radius: 56px;
    pointer-events: none;
    animation: framePulse 2.6s ease-in-out infinite .4s;
}
@keyframes framePulse {
    0%,100% { opacity: .5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.015); }
}

.frame-corner {
    position: absolute;
    font-size: 28px;
    z-index: 11;
    pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.9));
    animation: floatySway 4s ease-in-out infinite;
}
.corner-tl { top: -18px; left: -16px; }
.corner-tr { top: -18px; right: -16px; animation-delay: .5s; }
.corner-bl { bottom: -18px; left: -16px; animation-delay: 1s; }
.corner-br { bottom: -18px; right: -16px; animation-delay: 1.5s; }

/* =========================
   🌼 การ์ด
========================= */
.card {
    position: relative;
    z-index: 10;
    background: rgba(255,255,255,0.93);
    border-radius: 35px;
    box-shadow: 0 15px 35px rgba(90,120,60,0.18), 0 5px 15px rgba(255,255,255,0.4);
    max-width: 500px;
    margin: 0 auto;
    padding: 40px 30px;
    border: 3px solid rgba(255,255,255,0.8);
    opacity: 0;
    transform: scale(.82) translateY(50px) rotate(-1.5deg);
    animation: cardEnter .9s cubic-bezier(.22,.85,.32,1.2) .15s forwards,
               cardGlow 3.2s ease-in-out 1.1s infinite;
    overflow: hidden;
}
@keyframes cardEnter {
    to { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
}
@keyframes cardGlow {
    0%,100% { box-shadow: 0 15px 35px rgba(90,120,60,0.18), 0 5px 15px rgba(255,255,255,0.4), 0 0 25px rgba(255,214,140,.35); }
    50% { box-shadow: 0 15px 45px rgba(90,120,60,0.22), 0 5px 25px rgba(255,255,255,0.7), 0 0 45px rgba(255,158,200,.45); }
}

.card::before {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.6), transparent);
    transform: skewX(-20deg);
    animation: cardSheen 5s ease-in-out 1.3s infinite;
    pointer-events: none;
}
@keyframes cardSheen {
    0% { left: -60%; }
    35%, 100% { left: 140%; }
}

/* หัวข้อ */
h1 {
    font-size: 32px;
    margin-bottom: 6px;
    color: #e6127a;
    text-shadow: 2px 2px 0 #fff0da, 0 0 10px rgba(230,18,122,.25), 3px 3px 8px rgba(0,0,0,0.08);
    animation: titlePulse 2.4s ease-in-out infinite;
}
@keyframes titlePulse {
    0%,100% { color: #e6127a; }
    50% { color: #ff4fa0; }
}

.h-underline {
    display: block;
    width: 90px;
    height: 4px;
    margin: 4px auto 22px;
    border-radius: 4px;
    background: linear-gradient(90deg, #ffb6d9, #b7e88e);
    box-shadow: 0 0 10px rgba(255,182,217,.6);
    animation: underlinePulse 2.4s ease-in-out infinite;
}
@keyframes underlinePulse {
    0%,100% { width: 90px; opacity: .8; }
    50% { width: 130px; opacity: 1; }
}

p { font-size: 18px; line-height: 1.8; color: #5a7a42; }

strong {
    color: #e0669a;
    font-size: 20px;
    text-shadow: 0 0 8px rgba(255,150,190,0.25);
}

/* avatar ดอกไม้บนการ์ด */
.avatar-ring {
    width: 88px;
    height: 88px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    background: linear-gradient(135deg, #fff0c2, #ffd6ec, #d9f7c4, #fff0c2);
    background-size: 250% 250%;
    box-shadow: 0 0 20px rgba(255,214,140,.6), 0 0 35px rgba(255,158,200,.4);
    animation: avatarGlow 4s ease infinite, avatarBob 3s ease-in-out infinite;
}
@keyframes avatarGlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes avatarBob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }

/* =========================
   🌸 ปุ่ม
========================= */
.btn {
    position: relative;
    display: inline-block;
    overflow: hidden;
    margin-top: 20px;
    padding: 14px 28px;
    background: linear-gradient(135deg, #ffb6d9, #ff9ecb);
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    border-radius: 30px;
    box-shadow: 0 6px 15px rgba(255,158,203,0.4);
    transition: all 0.3s ease;
    animation: btnPulse 2.2s ease-in-out infinite;
}
@keyframes btnPulse {
    0%,100% { box-shadow: 0 6px 15px rgba(255,158,203,0.4); }
    50% { box-shadow: 0 8px 24px rgba(255,158,203,0.65), 0 0 20px rgba(255,230,180,.6); }
}
.btn::before {
    content: "";
    position: absolute;
    top: 0; left: -75%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.8), transparent);
    transform: skewX(-20deg);
    animation: btnSheen 3s ease-in-out infinite;
}
@keyframes btnSheen { 0% { left: -75%; } 40%, 100% { left: 140%; } }
.btn:hover {
    transform: translateY(-5px) scale(1.05);
    background: linear-gradient(135deg, #ff9ecb, #ff85b3);
    box-shadow: 0 10px 25px rgba(255,133,179,0.5);
}

/* แถวดอกไม้ด้านล่าง */
.card::after {
    content: "🌼  🌷  🌸  🌷  🌼";
    display: block;
    margin-top: 25px;
    color: #7db85f;
    font-size: 20px;
    letter-spacing: 6px;
    animation: starRow 2.6s ease-in-out infinite;
}
@keyframes starRow {
    0%,100% { opacity: .6; letter-spacing: 6px; }
    50% { opacity: 1; letter-spacing: 9px; }
}

/* ✨ ประกายตามเมาส์ */
.cursor-sparkle {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    font-size: 16px;
    line-height: 1;
    animation: sparkleFade .8s ease-out forwards;
}
@keyframes sparkleFade {
    0% { transform: translate(-50%,-50%) scale(.4) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1.3) rotate(120deg) translateY(-22px); opacity: 0; }
}

/* =========================
   🌸💚 เอฟเฟกต์เปลี่ยนหน้า
========================= */
.pt-circle {
    position: fixed;
    border-radius: 50%;
    background: radial-gradient(circle, #ff9ecb 0%, #ff6fb0 45%, #7ed88a 100%);
    width: 40px;
    height: 40px;
    transform: scale(0);
    z-index: 998;
}
.pt-circle.grow {
    animation: ptGrow .75s cubic-bezier(.6,0,.4,1) forwards;
}
@keyframes ptGrow {
    to { transform: scale(60); }
}

.pt-emoji {
    position: fixed;
    z-index: 1000;
    font-size: 34px;
    opacity: 0;
    pointer-events: none;
}
.pt-emoji.show {
    animation: ptEmojiPop .75s ease-out forwards;
}
@keyframes ptEmojiPop {
    0% { opacity: 0; transform: translateY(0) scale(.4) rotate(0deg); }
    30% { opacity: 1; transform: translateY(-20px) scale(1.1) rotate(15deg); }
    100% { opacity: 0; transform: translateY(-140px) scale(1) rotate(-20deg); }
}

.pt-label {
    position: fixed;
    z-index: 1001;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%) scale(.7);
    color: #ffffff;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 2px 8px rgba(0,0,0,.25);
    opacity: 0;
    pointer-events: none;
}
.pt-label.show {
    animation: ptLabelShow .75s ease-out forwards;
}
@keyframes ptLabelShow {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    45% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
}
</style>
</head>

<body>

<!-- 🌼 ดอกไม้ลอยขึ้น -->
<div class="bubble" style="left:6%;animation-delay:0s">🌸</div>
<div class="bubble" style="left:22%;animation-delay:2.5s">🌼</div>
<div class="bubble" style="left:38%;animation-delay:5s">🌷</div>
<div class="bubble" style="left:58%;animation-delay:1.5s">🌻</div>
<div class="bubble" style="left:74%;animation-delay:4s">🌺</div>
<div class="bubble" style="left:90%;animation-delay:3s">🌸</div>

<!-- 🦋 สติกเกอร์ลอยตกแต่ง -->
<span class="floaty" style="left:10%;top:30%;font-size:26px;animation-delay:.3s">🦋</span>
<span class="floaty" style="left:85%;top:25%;font-size:24px;animation-delay:1.2s">🐝</span>
<span class="floaty" style="left:78%;top:65%;font-size:30px;animation-delay:.8s">🌻</span>
<span class="floaty" style="left:14%;top:75%;font-size:22px;animation-delay:2s">🐞</span>
<span class="floaty" style="left:50%;top:12%;font-size:22px;animation-delay:1.6s">🌈</span>

<!-- 🌸 ดอกไม้ลอย ๆ ทั่วหน้าเว็บ -->
<div class="pearl pearl1 big">🌼</div>
<div class="pearl pearl2 small">🌷</div>
<div class="pearl pearl3">🌸</div>
<div class="pearl pearl4 small">🌺</div>
<div class="pearl pearl5 big">🌻</div>
<div class="pearl pearl6 small">🌼</div>
<div class="pearl pearl7">🌷</div>
<div class="pearl pearl8 big">🌸</div>
<div class="pearl pearl9 small">🌺</div>
<div class="pearl pearl10">🌻</div>

<!-- 🌷 เนื้อหา -->
<div class="frame-wrap">
    <span class="frame-corner corner-tl">🌷</span>
    <span class="frame-corner corner-tr">🌷</span>
    <span class="frame-corner corner-bl">🌷</span>
    <span class="frame-corner corner-br">🌷</span>

    <div class="card">

        <div class="avatar-ring">🌸</div>

        <h1>🌷 ยินดีต้อนรับสู่สวนดอกไม้ของฉัน 🌼</h1>
        <span class="h-underline"></span>

        <p>
            สวัสดีค่ะ! ฉันชื่อ<br>
            <strong>
                อริสรา แซ่ตั๊ง<br>
                (Arisara Saetang)
            </strong>
        </p>

        <p>
            💡 ขณะนี้กำลังศึกษา/สนใจด้าน<br>
            <strong>Math & Science Gifted</strong>
        </p>

        <p>
            🌻 นี่คือเว็บไซต์แรกของฉัน<br>
            ที่โฮสต์บน GitHub Pages!
        </p>

        <a href="portfolio.html" class="btn" id="portfolio-link">
            🌸 แฟ้มสะสมผลงาน
        </a>

    </div>
</div>

<script>
    const sparkleChars = ['🌸', '✨', '🌼', '⭐'];
    let lastSparkleTime = 0;
    document.addEventListener('mousemove', (e) => {
        const now = Date.now();
        if (now - lastSparkleTime < 160) return;
        lastSparkleTime = now;
        const s = document.createElement('span');
        s.className = 'cursor-sparkle';
        s.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
        s.style.left = e.clientX + 'px';
        s.style.top = e.clientY + 'px';
        s.style.color = Math.random() > 0.5 ? '#7db85f' : '#ff9ecb';
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 820);
    });

    /* 🌸💚 เอฟเฟกต์เปลี่ยนหน้าตอนกดแฟ้มสะสมผลงาน */
    const portfolioLink = document.getElementById('portfolio-link');
    portfolioLink.addEventListener('click', (e) => {
        e.preventDefault();
        const targetUrl = portfolioLink.getAttribute('href');
        const rect = portfolioLink.getBoundingClientRect();
        const originX = rect.left + rect.width / 2;
        const originY = rect.top + rect.height / 2;

        const circle = document.createElement('div');
        circle.className = 'pt-circle grow';
        circle.style.left = (originX - 20) + 'px';
        circle.style.top = (originY - 20) + 'px';
        document.body.appendChild(circle);

        const emojis = ['🌸', '🍃', '💚', '🌷', '🩷'];
        emojis.forEach((ch, i) => {
            const em = document.createElement('span');
            em.className = 'pt-emoji show';
            em.textContent = ch;
            em.style.left = (originX - 17 + (i - 2) * 26) + 'px';
            em.style.top = (originY - 17) + 'px';
            em.style.animationDelay = (i * 0.05) + 's';
            document.body.appendChild(em);
            setTimeout(() => em.remove(), 900);
        });

        const label = document.createElement('div');
        label.className = 'pt-label show';
        label.textContent = 'กำลังเปิดแฟ้มสะสมผลงาน...';
        document.body.appendChild(label);

        setTimeout(() => {
            window.location.href = targetUrl;
        }, 700);
    });
</script>

</body>
</html>
