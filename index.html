<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>หน้าแนะนำตัวของฉัน</title>

<style>

/* =========================================
   🌸 พื้นหลังโทนชมพู - เทอร์ควอยซ์ - ม่วง
========================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: "Tahoma", "Arial", sans-serif;

    color: #68456b;

    text-align: center;

    padding: 50px 20px;

    overflow-x: hidden;

    background:

        /* แสงกลม */
        radial-gradient(
            circle at 15% 20%,
            rgba(255,255,255,0.65) 0px,
            rgba(255,255,255,0) 180px
        ),

        radial-gradient(
            circle at 85% 25%,
            rgba(255,220,245,0.7) 0px,
            rgba(255,220,245,0) 200px
        ),

        radial-gradient(
            circle at 50% 90%,
            rgba(180,255,246,0.6) 0px,
            rgba(180,255,246,0) 220px
        ),

        /* สีหลัก */
        linear-gradient(
            135deg,
            #ffd6e7 0%,
            #c9f7f2 45%,
            #dcd1ff 100%
        );
}


/* =========================================
   💕 ลวดลายพื้นหลัง
========================================= */

body::before {
    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    top: -250px;
    left: -180px;

    border: 3px solid rgba(255,255,255,0.35);

    box-shadow:

        0 0 0 40px rgba(255,255,255,0.12),
        0 0 0 80px rgba(255,255,255,0.08),
        0 0 0 120px rgba(255,255,255,0.05);

    pointer-events: none;
}


/* =========================================
   💎 เพชรลอย
========================================= */

.gem {
    position: fixed;

    width: 18px;
    height: 18px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #a8fff5,
            #ffffff,
            #ffc4e6,
            #ffffff
        );

    transform: rotate(45deg);

    border-radius: 4px;

    box-shadow:
        0 0 8px white,
        0 0 18px #8ffff8,
        0 0 30px rgba(255,255,255,0.8);

    opacity: 0.8;

    pointer-events: none;

    animation:
        floatGem 7s ease-in-out infinite,
        sparkle 2s ease-in-out infinite;
}

.gem.small {
    width: 9px;
    height: 9px;
}

.gem.big {
    width: 27px;
    height: 27px;
}


/* ประกายเพชร */

.gem::before,
.gem::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 35px;
    height: 2px;

    background: white;

    transform: translate(-50%, -50%) rotate(-45deg);

    box-shadow: 0 0 8px white;
}

.gem::after {
    transform:
        translate(-50%, -50%)
        rotate(45deg);
}


/* การลอย */

@keyframes floatGem {

    0% {
        transform:
            translateY(30px)
            rotate(45deg);
    }

    50% {
        transform:
            translateY(-50px)
            rotate(135deg);
    }

    100% {
        transform:
            translateY(30px)
            rotate(225deg);
    }
}


/* วิบวับ */

@keyframes sparkle {

    0%,100% {
        opacity: 0.3;
        filter: brightness(0.8);
    }

    50% {
        opacity: 1;
        filter: brightness(1.8);
    }
}


/* ตำแหน่งเพชร */

.gem1 { left: 7%; top: 15%; }
.gem2 { left: 18%; top: 70%; animation-delay: 1s; }
.gem3 { left: 35%; top: 8%; animation-delay: 2s; }
.gem4 { left: 55%; top: 80%; animation-delay: 3s; }
.gem5 { left: 72%; top: 18%; animation-delay: 1.5s; }
.gem6 { left: 88%; top: 55%; animation-delay: 2.5s; }
.gem7 { left: 15%; top: 45%; animation-delay: 4s; }
.gem8 { left: 80%; top: 85%; animation-delay: 3.5s; }
.gem9 { left: 45%; top: 90%; animation-delay: 1s; }
.gem10 { left: 93%; top: 12%; animation-delay: 4.5s; }


/* =========================================
   💗 กรอบรูปหัวใจ
========================================= */

.card {

    position: relative;

    z-index: 10;

    width: min(520px, 92vw);

    min-height: 560px;

    margin: 30px auto;

    padding: 125px 75px 100px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    /* รูปหัวใจ */

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,0.96),
            rgba(255,238,248,0.94)
        );

    clip-path: polygon(
        50% 92%,
        8% 52%,
        5% 35%,
        10% 20%,
        23% 12%,
        35% 15%,
        50% 30%,
        65% 15%,
        77% 12%,
        90% 20%,
        95% 35%,
        92% 52%
    );

    filter:
        drop-shadow(0 15px 20px rgba(150,90,150,0.25))
        drop-shadow(0 0 15px rgba(255,255,255,0.8));

}


/* เส้นขอบหัวใจ */

.card::before {

    content: "";

    position: absolute;

    inset: 12px;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,0.3),
            rgba(255,180,220,0.15)
        );

    clip-path: polygon(
        50% 92%,
        8% 52%,
        5% 35%,
        10% 20%,
        23% 12%,
        35% 15%,
        50% 30%,
        65% 15%,
        77% 12%,
        90% 20%,
        95% 35%,
        92% 52%
    );

    pointer-events: none;
}


/* =========================================
   ✨ หัวข้อ
========================================= */

h1 {

    color: #b54f88;

    font-size: 30px;

    line-height: 1.4;

    margin-bottom: 20px;

    text-shadow:

        2px 2px 0 #ffe5f3,

        0 0 10px rgba(255,120,190,0.3);
}


/* =========================================
   🌷 ข้อความ
========================================= */

p {

    font-size: 17px;

    line-height: 1.8;

    color: #65506d;

    margin: 10px 0;
}


strong {

    color: #d85c91;

    font-size: 19px;

    text-shadow:
        0 0 7px rgba(255,120,180,0.25);
}


/* =========================================
   💎 ปุ่ม
========================================= */

.btn {

    display: inline-block;

    margin-top: 22px;

    padding: 13px 28px;

    border-radius: 30px;

    background:

        linear-gradient(
            135deg,
            #ff83b8,
            #c58cff,
            #61dcd4
        );

    background-size: 200% 200%;

    color: white;

    text-decoration: none;

    font-size: 17px;

    font-weight: bold;

    box-shadow:

        0 7px 20px rgba(205,100,170,0.35),

        0 0 15px rgba(255,255,255,0.5);

    transition: 0.4s;
}


.btn:hover {

    transform:
        translateY(-6px)
        scale(1.07);

    background-position: 100% 50%;

    box-shadow:

        0 12px 30px rgba(205,100,170,0.45),

        0 0 25px rgba(255,255,255,0.8);
}


/* =========================================
   🌟 ดาวตกแต่ง
========================================= */

.star {

    color: #c987e8;

    font-size: 20px;

    letter-spacing: 8px;

    margin-top: 15px;

    text-shadow:
        0 0 10px #ffffff;
}

</style>
</head>


<body>


<!-- 💎 เพชรลอยทั่วเว็บ -->

<div class="gem gem1 big"></div>
<div class="gem gem2 small"></div>
<div class="gem gem3"></div>
<div class="gem gem4 small"></div>
<div class="gem gem5 big"></div>
<div class="gem gem6 small"></div>
<div class="gem gem7"></div>
<div class="gem gem8 big"></div>
<div class="gem gem9 small"></div>
<div class="gem gem10"></div>


<!-- 💗 หัวใจ -->

<div class="card">

    <h1>
        💗 ยินดีต้อนรับสู่<br>
        โปรไฟล์ของฉัน 💎
    </h1>


    <p>
        สวัสดีค่ะ! ฉันชื่อ
    </p>

    <p>
        <strong>
            อริสรา แซ่ตั๊ง<br>
            (Arisara Saetang)
        </strong>
    </p>


    <p>
        🧪 ขณะนี้กำลังศึกษา/สนใจด้าน
    </p>

    <p>
        <strong>
            Math & Science Gifted
        </strong>
    </p>


    <p>
        ✨ นี่คือเว็บไซต์แรกของฉัน<br>
        ที่โฮสต์บน GitHub Pages!
    </p>


    <a href="portfolio.html" class="btn">
        💎 แฟ้มสะสมผลงาน
    </a>


    <div class="star">
        ✦ ✧ 💎 ✧ ✦
    </div>

</div>

</body>
</html>
