<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO - นางสาวอริสรา  แซ่ตั๊ง</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brown-dark: #4A2E2B;       /* สีน้ำตาลเข้มหรูหรา */
            --brown-medium: #6E473B;     /* สีน้ำตาลอมส้มอุ่น */
            --gold-luxury: #C5A059;      /* สีทองคลาสสิก */
            --gold-glow: rgba(197, 160, 89, 0.35);
            --pink-bg: linear-gradient(135deg, #FFF0F3 0%, #FBE4E8 50%, #F5D6DE 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Prompt', sans-serif;
            background: var(--pink-bg);
            color: var(--brown-dark);
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* เอฟเฟกต์ Fade-out ละมุนๆ ตอนกดเปลี่ยนหน้า */
        body.fade-out {
            opacity: 0;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .hero-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* ชื่อภาษาไทย: สีน้ำตาลเข้มพรีเมียม */
        .name-th {
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 600;
            color: var(--brown-dark);
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(74, 46, 43, 0.08);
        }

        /* ชื่อภาษาอังกฤษ: สีทองหรูหรา */
        .name-en {
            font-family: 'Cinzel', serif;
            font-size: clamp(1rem, 2.2vw, 1.8rem);
            font-weight: 700;
            color: var(--gold-luxury);
            letter-spacing: 6px;
            margin-bottom: 34px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px var(--gold-glow);
        }

        /* ป้ายชื่อโรงเรียน: กรอบทอง ตัวหนังสือสีน้ำตาล */
        .school-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid var(--gold-luxury);
            backdrop-filter: blur(10px);
            padding: 12px 30px;
            border-radius: 50px;
            font-size: clamp(0.95rem, 1.5vw, 1.2rem);
            color: var(--brown-dark);
            box-shadow: 0 8px 25px rgba(197, 160, 89, 0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .school-badge i {
            color: var(--gold-luxury);
        }

        .hero-container:hover .school-badge {
            transform: translateY(-3px);
            border-color: #B38E46;
            box-shadow: 0 12px 30px rgba(197, 160, 89, 0.25);
        }

        /* ข้อความบอกใบ้ด้านล่าง: สีทองสลับสีน้ำตาลอ่อน */
        .scroll-hint {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--gold-luxury);
            font-family: 'Cinzel', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 3px;
            animation: bounce 2.2s infinite ease-in-out;
        }

        .scroll-hint i {
            font-size: 1.1rem;
            color: var(--brown-medium);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="hero-container">
        <h1 class="name-th">นางสาวอริสรา แซ่ตั๊ง</h1>
        <div class="name-en">ARISARA SAETANG</div>
        
        <div class="school-badge">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</span>
        </div>

        <div class="scroll-hint">
            <span>CLICK OR SCROLL TO ENTER</span>
            <i class="fa-solid fa-chevron-down"></i>
        </div>
    </div>

    <script>
        // Particle System (เม็ดประกายทองและชมพูพาสเทลลอยละมุนด้านหลัง)
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 80;
                this.radius = Math.random() * 2.8 + 1.2;
                this.speedY = Math.random() * 0.4 + 0.15;
                this.speedX = Math.random() * 0.2 - 0.1;
                this.alpha = Math.random() * 0.5 + 0.25;
                // สลับสีทองและชมพูอ่อนวิ้งๆ
                this.color = Math.random() > 0.4 
                    ? `rgba(197, 160, 89, ${this.alpha})` 
                    : `rgba(222, 93, 131, ${this.alpha})`;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(197, 160, 89, 0.4)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 55; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // Smooth Navigation (กดหรือเลื่อนตรงไหนก็ได้เพื่อเปลี่ยนหน้าแบบละมุน)
        let isTransitioning = false;

        function goToNextPage() {
            if (isTransitioning) return;
            isTransitioning = true;
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'portfolio.html';
            }, 750);
        }

        window.addEventListener('click', goToNextPage);
        window.addEventListener('wheel', goToNextPage);
        window.addEventListener('touchend', goToNextPage);
    </script>
</body>
</html>
