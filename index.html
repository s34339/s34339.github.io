<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO - นางสาวอริสรา  แซ่ตั๊ง</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --text-main: #6B4F63;        /* น้ำตาลอมม่วงหวานๆ อ่านง่าย */
            --text-soft: #8C7088;
            --pink-main: #F6A9CE;        /* ชมพูพาสเทลหลัก */
            --pink-light: #FFDCEC;       /* ชมพูอ่อน */
            --pink-glow: rgba(246, 169, 206, 0.35);
            --green-main: #9AD9AE;       /* เขียวพาสเทลหลัก */
            --green-light: #D6F5DE;      /* เขียวอ่อน */
            --green-dark: #6FBE87;
            --sky-bg: linear-gradient(180deg, #FFF8FB 0%, #FDEAF3 30%, #EAF9EE 65%, #D9F5E1 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Prompt', sans-serif;
            background: var(--sky-bg);
            color: var(--text-main);
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        body.fade-out { opacity: 0; }

        /* ===== ฉากสวนดอกไม้พื้นหลัง ===== */
        .garden-scene {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .sun-glow {
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 220, 236, 0.6) 0%, rgba(255, 220, 236, 0) 70%);
        }

        .hill {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 140vw;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }
        .hill-1 { height: 220px; background: #FBD3E6; opacity: 0.55; bottom: -90px; }
        .hill-2 { height: 190px; background: #D7F2DE; opacity: 0.6; bottom: -70px; width: 150vw; }
        .hill-3 { height: 150px; background: linear-gradient(180deg, #BDEACB 0%, #9AD9AE 100%); bottom: -40px; width: 160vw; }

        .flower-bed { position: absolute; bottom: 0; left: 0; width: 100%; height: 160px; }

        .flower {
            position: absolute;
            width: 30px;
            height: 30px;
            animation: sway 4.5s ease-in-out infinite;
            transform-origin: 50% 100%;
        }
        .petal {
            position: absolute;
            width: 12px;
            height: 17px;
            top: 50%;
            left: 50%;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform-origin: 6px 17px;
            margin-left: -6px;
            margin-top: -17px;
        }
        .flower-center {
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 8px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: #FFF3B0;
            box-shadow: 0 0 6px rgba(255, 243, 176, 0.7);
        }
        .stem {
            position: absolute;
            top: 60%; left: 50%;
            width: 2px;
            background: var(--green-dark);
            transform: translateX(-50%);
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
        }

        .vine-corner {
            position: absolute;
            width: 220px;
            height: 220px;
            opacity: 0.85;
        }
        .vine-tl { top: -10px; left: -10px; }
        .vine-br { bottom: -10px; right: -10px; transform: rotate(180deg); }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* ===== ประตูเปิดฉากอลังการ ===== */
        #gate-overlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            pointer-events: none;
        }
        .gate-panel {
            width: 50%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 60%),
                linear-gradient(135deg, #9AD9AE 0%, #6FBE87 100%);
            position: relative;
            transition: transform 1.3s cubic-bezier(0.7, 0, 0.15, 1);
            box-shadow: 0 0 60px rgba(0,0,0,0.15);
        }
        .gate-panel::before {
            content: '';
            position: absolute;
            inset: 18px;
            border: 2px solid #FFFFFF;
            border-radius: 4px;
            box-shadow: inset 0 0 25px rgba(255,255,255,0.35);
        }
        .gate-panel.left { border-right: 2px solid #FFDCEC; }
        .gate-panel.right { border-left: 2px solid #FFDCEC; }

        .gate-emblem {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            z-index: 21;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #FFF0F7 55%, var(--pink-main) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px var(--pink-glow), 0 0 80px rgba(154, 217, 174, 0.35);
            transition: opacity 0.9s ease, transform 0.9s ease;
        }
        .gate-emblem i {
            font-size: 2.6rem;
            color: var(--pink-main);
        }

        #gate-overlay.opening .gate-panel.left { transform: translateX(-100%); }
        #gate-overlay.opening .gate-panel.right { transform: translateX(100%); }
        .gate-emblem.hide { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }

        .sparkle-burst {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 40px 20px rgba(255,255,255,0.9), 0 0 90px 50px var(--pink-glow);
            z-index: 22;
            opacity: 0;
            pointer-events: none;
        }
        .sparkle-burst.flash {
            animation: burst 0.9s ease-out forwards;
        }
        @keyframes burst {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(18); }
        }

        /* ===== เนื้อหาหลัก ===== */
        .hero-container {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 1.1s ease, transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .hero-container.reveal {
            opacity: 1;
            transform: scale(1);
        }

        .profile-frame {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 25px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--pink-main), #FFFFFF, var(--green-main));
            box-shadow: 0 10px 30px rgba(246, 169, 206, 0.3), 0 5px 15px rgba(154, 217, 174, 0.25);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #FFF;
        }

        .hero-container:hover .profile-frame {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(246, 169, 206, 0.4), 0 8px 20px rgba(154, 217, 174, 0.3);
        }

        .name-th {
            font-size: clamp(2rem, 4.5vw, 3.5rem);
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 0 4px 15px rgba(107, 79, 99, 0.08);
        }

        .name-en {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.95rem, 2vw, 1.6rem);
            font-weight: 700;
            color: var(--pink-main);
            letter-spacing: 6px;
            margin-bottom: 28px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px var(--pink-glow);
        }

        .school-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--green-main);
            backdrop-filter: blur(10px);
            padding: 12px 30px;
            border-radius: 50px;
            font-size: clamp(0.9rem, 1.4vw, 1.15rem);
            color: var(--text-main);
            box-shadow: 0 8px 25px rgba(154, 217, 174, 0.2);
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .school-badge i { color: var(--pink-main); }

        .hero-container:hover .school-badge {
            transform: translateY(-3px);
            border-color: var(--green-dark);
            box-shadow: 0 12px 30px rgba(154, 217, 174, 0.3);
        }

        .scroll-hint {
            position: absolute;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--pink-main);
            font-family: 'Cinzel', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 3px;
            animation: bounce 2.2s infinite ease-in-out;
        }

        .scroll-hint i { font-size: 1.1rem; color: var(--green-dark); }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>

    <!-- ประตูเปิดฉากอลังการ -->
    <div id="gate-overlay">
        <div class="gate-panel left"></div>
        <div class="gate-panel right"></div>
    </div>
    <div class="gate-emblem"><i class="fa-solid fa-spa"></i></div>
    <div class="sparkle-burst" id="sparkleBurst"></div>

    <!-- ฉากสวนดอกไม้ -->
    <div class="garden-scene">
        <div class="sun-glow"></div>
        <svg class="vine-corner vine-tl" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,0 Q60,10 50,60 T30,140 Q40,180 90,190" stroke="#9AD9AE" stroke-width="4" fill="none"/>
            <circle cx="50" cy="60" r="9" fill="#F6A9CE"/>
            <circle cx="30" cy="140" r="7" fill="#FFDCEC"/>
            <circle cx="90" cy="190" r="8" fill="#D6F5DE"/>
            <circle cx="20" cy="30" r="6" fill="#FFDCEC"/>
        </svg>
        <svg class="vine-corner vine-br" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,0 Q60,10 50,60 T30,140 Q40,180 90,190" stroke="#9AD9AE" stroke-width="4" fill="none"/>
            <circle cx="50" cy="60" r="9" fill="#F6A9CE"/>
            <circle cx="30" cy="140" r="7" fill="#FFDCEC"/>
            <circle cx="90" cy="190" r="8" fill="#D6F5DE"/>
            <circle cx="20" cy="30" r="6" fill="#FFDCEC"/>
        </svg>
        <div class="hill hill-1"></div>
        <div class="hill hill-2"></div>
        <div class="hill hill-3"></div>
        <div class="flower-bed" id="flowerBed"></div>
    </div>

    <canvas id="particleCanvas"></canvas>

    <div class="hero-container" id="heroContainer">
        <div class="profile-frame">
            <img src="Parn.jpg" alt="นางสาวอริสรา แซ่ตั๊ง" class="profile-img">
        </div>

        <h1 class="name-th">นางสาวอริสรา แซ่ตั๊ง</h1>
        <div class="name-en">ARISARA SAETANG</div>

        <div class="school-badge">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</span>
        </div>

        <div class="scroll-hint">
            <span>CLICK OR SCROLL TO ENTER</span>
            <i class="fa-solid fa-chevron-down"></i>
        </div>
    </div>

    <script>
        /* ---------- สร้างดอกไม้พื้นหลัง ---------- */
        const flowerColors = ['#F6A9CE', '#FFDCEC', '#FFFFFF', '#9AD9AE', '#D6F5DE'];
        const flowerBed = document.getElementById('flowerBed');
        const flowerCount = 22;
        for (let i = 0; i < flowerCount; i++) {
            const flower = document.createElement('div');
            flower.className = 'flower';
            const size = 22 + Math.random() * 26;
            const left = Math.random() * 100;
            const bottom = Math.random() * 90;
            const delay = Math.random() * 3;
            const duration = 3.5 + Math.random() * 3;
            const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];

            flower.style.width = size + 'px';
            flower.style.height = size + 'px';
            flower.style.left = left + '%';
            flower.style.bottom = bottom + 'px';
            flower.style.animationDelay = delay + 's';
            flower.style.animationDuration = duration + 's';

            const stem = document.createElement('div');
            stem.className = 'stem';
            stem.style.height = (size * 0.9) + 'px';
            flower.appendChild(stem);

            for (let p = 0; p < 5; p++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.background = color;
                petal.style.transform = `translate(-50%,-50%) rotate(${p * 72}deg) translateY(-8px)`;
                flower.appendChild(petal);
            }
            const center = document.createElement('div');
            center.className = 'flower-center';
            flower.appendChild(center);

            flowerBed.appendChild(flower);
        }

        /* ---------- อนุภาคกลีบดอกไม้ + ประกายลอย ---------- */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Petal {
            constructor() { this.reset(true); }
            reset(initial) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : -20;
                this.size = Math.random() * 6 + 5;
                this.speedY = Math.random() * 0.6 + 0.3;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.03;
                this.alpha = Math.random() * 0.4 + 0.4;
                this.color = Math.random() > 0.5 ? `rgba(246,169,206,${this.alpha})` : `rgba(154,217,174,${this.alpha})`;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.02) * 0.3;
                this.angle += this.spin;
                if (this.y > canvas.height + 20) this.reset(false);
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = 'rgba(246,169,206,0.3)';
                ctx.fill();
                ctx.restore();
            }
        }

        class Sparkle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 80;
                this.radius = Math.random() * 2.2 + 1;
                this.speedY = Math.random() * 0.35 + 0.12;
                this.alpha = Math.random() * 0.5 + 0.25;
            }
            update() { this.y -= this.speedY; if (this.y < -10) this.reset(); }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(154,217,174,0.4)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 22; i++) particles.push(new Petal());
        for (let i = 0; i < 35; i++) particles.push(new Sparkle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        /* ---------- ฉากเปิดอลังการ ---------- */
        const gateOverlay = document.getElementById('gate-overlay');
        const gateEmblem = document.querySelector('.gate-emblem');
        const sparkleBurst = document.getElementById('sparkleBurst');
        const heroContainer = document.getElementById('heroContainer');

        window.addEventListener('load', () => {
            setTimeout(() => {
                sparkleBurst.classList.add('flash');
                gateEmblem.classList.add('hide');
                gateOverlay.classList.add('opening');
            }, 700);

            setTimeout(() => {
                heroContainer.classList.add('reveal');
            }, 1250);

            setTimeout(() => {
                gateOverlay.style.display = 'none';
            }, 2200);
        });

        /* ---------- นำทางไปหน้าถัดไป ---------- */
        let isTransitioning = false;
        let introDone = false;
        setTimeout(() => { introDone = true; }, 2200);

        function goToNextPage() {
            if (isTransitioning || !introDone) return;
            isTransitioning = true;
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'portfolio.html';
            }, 750);
        }

        window.addEventListener('click', goToNextPage);
        window.addEventListener('wheel', goToNextPage);
        window.addEventListener('touchend', goToNextPage);
    </script>
</body>
</html>
