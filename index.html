<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแนะนำตัวของฉัน</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.25) 0 50px, transparent 51px),
        radial-gradient(circle at 85% 80%, rgba(255,255,255,0.18) 0 80px, transparent 81px),
        radial-gradient(circle at 80% 15%, rgba(255,255,255,0.15) 0 35px, transparent 36px),
        linear-gradient(135deg, #16bfb8, #40e0d0, #66d9e8);

    color: #174f5a;
    text-align: center;
    padding: 50px 20px;
    font-family: "Tahoma", "Arial", sans-serif;
    overflow: hidden;
}

/* วงแหวนตกแต่งพื้นหลัง */
body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    border: 3px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    top: -180px;
    left: -150px;

    box-shadow:
        0 0 0 40px rgba(255,255,255,0.08),
        0 0 0 80px rgba(255,255,255,0.06),
        0 0 0 120px rgba(255,255,255,0.04);

    pointer-events: none;
}

/* =========================
   💎 เอฟเฟกต์เพชร
========================= */

.gem {
    position: fixed;
    width: 18px;
    height: 18px;

    background: linear-gradient(
        135deg,
        #ffffff 0%,
        #bffcff 25%,
        #ffffff 45%,
        #ffbde8 70%,
        #ffffff 100%
    );

    transform: rotate(45deg);
    border-radius: 3px;

    box-shadow:
        0 0 8px #ffffff,
        0 0 18px #8ffff8,
        0 0 30px rgba(255,255,255,0.8);

    opacity: 0.85;

    pointer-events: none;

    animation:
        floatGem 7s ease-in-out infinite,
        sparkle 2s ease-in-out infinite;
}

/* ประกายแฉกของเพชร */
.gem::before,
.gem::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;

    width: 35px;
    height: 2px;

    background: rgba(255,255,255,0.9);

    transform: translate(-50%, -50%) rotate(-45deg);

    box-shadow: 0 0 8px white;
}

.gem::after {
    transform: translate(-50%, -50%) rotate(45deg);
}

/* การลอยของเพชร */
@keyframes floatGem {

    0% {
        transform: translateY(30px) rotate(45deg);
    }

    50% {
        transform: translateY(-50px) rotate(135deg);
    }

    100% {
        transform: translateY(30px) rotate(225deg);
    }
}

/* เอฟเฟกต์วิบวับ */
@keyframes sparkle {

    0%, 100% {
        opacity: 0.35;
        filter: brightness(0.8);
    }

    50% {
        opacity: 1;
        filter: brightness(1.8);
    }
}

/* เพชรขนาดเล็ก */
.gem.small {
    width: 9px;
    height: 9px;
}

/* เพชรขนาดใหญ่ */
.gem.big {
    width: 25px;
    height: 25px;
}

/* =========================
   💎 การ์ด
========================= */

.card {
    position: relative;
    z-index: 10;

    background: rgba(255,255,255,0.92);

    border-radius: 35px;

    box-shadow:
        0 15px 35px rgba(0,80,90,0.20),
        0 5px 15px rgba(255,255,255,0.4);

    max-width: 500px;
    margin: 50px auto;

    padding: 40px 30px;

    border: 3px solid rgba(255,255,255,0.7);
}

/* หัวข้อ */
h1 {
    color: #087f8c;

    font-size: 32px;

    margin-bottom: 25px;

    text-shadow:
        2px 2px 0 #b8f3f0,
        3px 3px 8px rgba(0,0,0,0.1);
}

/* ข้อความ */
p {
    font-size: 18px;
    line-height: 1.8;
    color: #28656d;
}

/* ชื่อ */
strong {
    color: #e05a8a;
    font-size: 20px;

    text-shadow:
        0 0 8px rgba(255,100,160,0.2);
}

/* =========================
   🌸 ปุ่ม
========================= */

.btn {
    display: inline-block;

    margin-top: 20px;

    padding: 14px 28px;

    background:
        linear-gradient(
            135deg,
            #ff7eb3,
            #ff758c
        );

    color: white;

    text-decoration: none;

    font-size: 18px;
    font-weight: bold;

    border-radius: 30px;

    box-shadow:
        0 6px 15px rgba(255,117,140,0.35);

    transition: all 0.3s ease;
}

.btn:hover {
    transform: translateY(-5px) scale(1.05);

    background:
        linear-gradient(
            135deg,
            #ff5f9e,
            #ff477e
        );

    box-shadow:
        0 10px 25px rgba(255,80,120,0.45);
}

/* ดาวด้านล่าง */
.card::after {
    content: "✦  ✧  💎  ✧  ✦";

    display: block;

    margin-top: 25px;

    color: #40c9c3;

    font-size: 20px;

    letter-spacing: 6px;
}

/* =========================
   💎 เพชรแต่ละดวง
========================= */

.gem1 {
    left: 8%;
    top: 15%;
    animation-delay: 0s;
}

.gem2 {
    left: 20%;
    top: 70%;
    animation-delay: 1s;
}

.gem3 {
    left: 35%;
    top: 10%;
    animation-delay: 2s;
}

.gem4 {
    left: 55%;
    top: 80%;
    animation-delay: 3s;
}

.gem5 {
    left: 72%;
    top: 20%;
    animation-delay: 1.5s;
}

.gem6 {
    left: 88%;
    top: 55%;
    animation-delay: 2.5s;
}

.gem7 {
    left: 15%;
    top: 45%;
    animation-delay: 4s;
}

.gem8 {
    left: 80%;
    top: 85%;
    animation-delay: 3.5s;
}

.gem9 {
    left: 45%;
    top: 90%;
    animation-delay: 1s;
}

.gem10 {
    left: 93%;
    top: 12%;
    animation-delay: 4.5s;
}
</style>
</head>

<body>

<!-- 💎 เพชรลอย ๆ ทั่วหน้าเว็บ -->
<div class="gem gem1 big"></div>
<div class="gem gem2 small"></div>
<div class="gem gem3"></div>
<div class="gem gem4 small"></div>
<div class="gem gem5 big"></div>
<div class="gem gem6 small"></div>
<div class="gem gem7"></div>
<div class="gem gem8 big"></div>
<div class="gem gem9 small"></div>
<div class="gem gem10"></div>

<!-- 💎 เนื้อหา -->
<div class="card">

    <h1>
        💎 ยินดีต้อนรับสู่โปรไฟล์ของฉัน 🌸
    </h1>

    <p>
        สวัสดีค่ะ! ฉันชื่อ
        <strong>
            อริสรา แซ่ตั๊ง<br>
            (Arisara Saetang)
        </strong>
    </p>

    <p>
        💡 ขณะนี้กำลังศึกษา/สนใจด้าน<br>
        <strong>Math & Science Gifted</strong>
    </p>

    <p>
        ✨ นี่คือเว็บไซต์แรกของฉัน<br>
        ที่โฮสต์บน GitHub Pages!
    </p>

    <a href="portfolio.html" class="btn">
        💎 แฟ้มสะสมผลงาน
    </a>

</div>

</body>
</html>
