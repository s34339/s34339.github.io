<title>Portfolio | Arisara Saetang</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, sans-serif;
    color: #704a70;
    overflow-x: hidden;

    background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.6), transparent 180px),
        radial-gradient(circle at 85% 25%, rgba(255,190,225,.5), transparent 200px),
        linear-gradient(135deg, #ffd4e7, #bff5ee, #d8c9ff);

    position: relative;
}

/* 🌊 คลื่นพื้นหลัง */
body::before,
body::after {
    content: "";
    position: fixed;
    left: -10%;
    width: 120%;
    height: 180px;
    border-radius: 50%;
    pointer-events: none;
}

body::before {
    bottom: -80px;
    background: rgba(255,255,255,.35);
    animation: wave 7s ease-in-out infinite;
}

body::after {
    bottom: -110px;
    background: rgba(91,220,207,.18);
    animation: wave 9s ease-in-out infinite reverse;
}

@keyframes wave {
    0%,100% {
        transform: translateX(-3%) rotate(1deg);
    }

    50% {
        transform: translateX(3%) rotate(-1deg);
    }
}

/* 💎 เพชร */
.gem {
    position: fixed;
    width: 17px;
    height: 17px;
    background: linear-gradient(
        135deg,
        white,
        #a5fff5,
        white,
        #ffb9df
    );
    transform: rotate(45deg);
    box-shadow:
        0 0 8px white,
        0 0 18px #7fffea,
        0 0 30px rgba(255,255,255,.7);
    animation: float 6s ease-in-out infinite;
    pointer-events: none;
}

@keyframes float {
    0%,100% {
        transform: translateY(20px) rotate(45deg);
        opacity: .4;
    }

    50% {
        transform: translateY(-45px) rotate(135deg);
        opacity: 1;
    }
}

.g1 { left: 8%; top: 18%; }
.g2 { left: 20%; top: 75%; animation-delay: 1s; }
.g3 { left: 80%; top: 20%; animation-delay: 2s; }
.g4 { left: 90%; top: 70%; animation-delay: 3s; }
.g5 { left: 35%; top: 10%; animation-delay: 4s; }
.g6 { left: 65%; top: 85%; animation-delay: 1.5s; }

/* ⭐ หน้าปก */
.cover {
    position: relative;
    z-index: 5;

    width: min(900px, 92%);
    min-height: 620px;

    margin: 40px auto;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 60px 30px;

    background: rgba(255,255,255,.78);

    border: 3px solid rgba(255,255,255,.9);

    border-radius: 55px;

    box-shadow:
        0 20px 50px rgba(130,70,130,.2),
        inset 0 0 30px rgba(255,255,255,.6);

    backdrop-filter: blur(10px);
}

/* กรอบรูป */
.photo-frame {
    padding: 8px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #ff82b7,
            #72e8dc,
            #b48cff,
            #ff82b7
        );

    box-shadow:
        0 0 20px rgba(255,255,255,.9),
        0 0 35px rgba(255,120,190,.35);
}

.photo-frame img {
    width: 170px;
    height: 170px;

    object-fit: cover;

    border-radius: 50%;

    display: block;

    border: 5px solid white;
}

h1 {
    margin: 25px 0 10px;

    font-size: 42px;

    color: #c64f91;

    text-shadow:
        2px 2px white,
        0 0 15px rgba(255,130,190,.35);
}

.subtitle {
    font-size: 20px;
    color: #488d91;
}

/* 📚 เมนู */
.menu {
    margin-top: 30px;

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;

    max-width: 750px;
}

.menu a {
    text-decoration: none;

    color: white;

    padding: 13px 20px;

    border-radius: 25px;

    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            #ff82b7,
            #8dded5
        );

    box-shadow:
        0 5px 15px rgba(200,90,150,.2);

    transition: .3s;
}

.menu a:hover {
    transform: translateY(-6px) scale(1.05);

    box-shadow:
        0 10px 25px rgba(200,90,150,.35);
}

footer {
    margin-top: 25px;
    color: #8b658b;
}
</style>
</head>
