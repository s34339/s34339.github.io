<!DOCTYPE html>
<html lang="th">

<meta charset="UTF-8">

<title>Arisara Portfolio</title>

<style>

/* ================================
   🌊 พื้นฐาน
================================ */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    font-family: Tahoma, Arial, sans-serif;

    min-height: 100vh;

    overflow-x: hidden;

    color: white;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,255,255,.35),
            transparent 180px
        ),

        radial-gradient(
            circle at 85% 25%,
            rgba(255,80,180,.25),
            transparent 220px
        ),

        linear-gradient(
            135deg,
            #00cfc1 0%,
            #00aebd 38%,
            #ff4fa3 100%
        );
}


/* ================================
   🌊 แสงใต้ทะเล
================================ */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at 50% 0%,
            rgba(255,255,255,.35),
            transparent 45%
        );

    z-index: 0;
}


/* ================================
   🌊 คลื่นใหญ่
================================ */

.wave {

    position: fixed;

    left: -15%;

    bottom: -100px;

    width: 130%;

    height: 260px;

    border-radius: 50% 50% 0 0;

    z-index: 1;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.45),
            rgba(0,220,205,.5)
        );

    box-shadow:
        0 -20px 50px rgba(255,255,255,.25);

    animation:
        bigWave 5s ease-in-out infinite;
}


.wave.two {

    bottom: -145px;

    height: 280px;

    opacity: .65;

    background:
        linear-gradient(
            to bottom,
            rgba(255,80,180,.35),
            rgba(0,180,190,.45)
        );

    animation:
        bigWave 7s ease-in-out infinite reverse;
}


.wave.three {

    bottom: -190px;

    height: 300px;

    opacity: .5;

    animation:
        bigWave 9s ease-in-out infinite;
}


@keyframes bigWave {

    0%,100% {
        transform:
            translateX(-5%)
            rotate(1deg);
    }

    50% {
        transform:
            translateX(5%)
            rotate(-2deg);
    }
}


/* ================================
   💎 เพชร
================================ */

.diamond {

    position: fixed;

    width: 22px;
    height: 22px;

    transform: rotate(45deg);

    background:
        linear-gradient(
            135deg,
            white,
            #7ffff3,
            white,
            #ff70b7,
            white
        );

    border-radius: 4px;

    box-shadow:
        0 0 10px white,
        0 0 25px #5ffff0,
        0 0 40px #ff64b3;

    z-index: 3;

    animation:
        diamondFloat 6s ease-in-out infinite,
        diamondSparkle 2s infinite;
}


@keyframes diamondFloat {

    0% {
        transform:
            translateY(30px)
            rotate(45deg);
    }

    50% {
        transform:
            translateY(-70px)
            rotate(135deg);
    }

    100% {
        transform:
            translateY(30px)
            rotate(225deg);
    }
}


@keyframes diamondSparkle {

    0%,100% {
        opacity: .35;
        filter: brightness(.8);
    }

    50% {
        opacity: 1;
        filter: brightness(2);
    }
}


.d1 { left: 5%; top: 15%; }
.d2 { left: 18%; top: 65%; animation-delay: 1s; }
.d3 { left: 32%; top: 10%; animation-delay: 2s; }
.d4 { left: 70%; top: 15%; animation-delay: 1.5s; }
.d5 { left: 88%; top: 35%; animation-delay: 3s; }
.d6 { left: 80%; top: 75%; animation-delay: 2s; }
.d7 { left: 12%; top: 85%; animation-delay: 4s; }


/* ================================
   🫧 ฟองอากาศ
================================ */

.bubble {

    position: fixed;

    bottom: -50px;

    width: 18px;
    height: 18px;

    border:
        2px solid rgba(255,255,255,.65);

    border-radius: 50%;

    z-index: 2;

    animation:
        bubbleUp 8s linear infinite;
}


.b1 {
    left: 10%;
    animation-delay: 1s;
}

.b2 {
    left: 30%;
    width: 12px;
    height: 12px;
    animation-delay: 4s;
}

.b3 {
    left: 55%;
    width: 25px;
    height: 25px;
    animation-delay: 2s;
}

.b4 {
    left: 75%;
    animation-delay: 5s;
}

.b5 {
    left: 90%;
    width: 10px;
    height: 10px;
    animation-delay: 3s;
}


@keyframes bubbleUp {

    0% {
        transform:
            translateY(0)
            translateX(0);
        opacity: 0;
    }

    20% {
        opacity: .8;
    }

    100% {
        transform:
            translateY(-110vh)
            translateX(60px);
        opacity: 0;
    }
}


/* ================================
   💗 กล่องหน้าปก
================================ */

.container {

    position: relative;

    z-index: 10;

    width: min(1050px, 92%);

    margin: 40px auto 250px;

}


.cover {

    min-height: 700px;

    padding: 55px 35px;

    text-align: center;

    border-radius: 60px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.92),
            rgba(255,215,238,.82)
        );

    border:
        4px solid rgba(255,255,255,.95);

    box-shadow:

        0 30px 70px
        rgba(70,50,100,.35),

        inset 0 0 35px
        rgba(255,255,255,.8);

    backdrop-filter: blur(15px);

}


/* ================================
   👑 กรอบรูป
================================ */

.photo-frame {

    display: inline-block;

    padding: 10px;

    border-radius: 50%;

    background:

        conic-gradient(
            #ff1590,
            #ff79c6,
            #00f5dd,
            white,
            #00d8ca,
            #ff1590
        );

    box-shadow:

        0 0 20px white,

        0 0 40px #ff42a8,

        0 0 60px #00ffe5;

    animation:
        frameRotate 5s linear infinite;
}


.photo-frame img {

    display: block;

    width: 210px;
    height: 210px;

    object-fit: cover;

    border-radius: 50%;

    border: 7px solid white;
}


@keyframes frameRotate {

    to {
        filter:
            hue-rotate(360deg);
    }
}


/* ================================
   ✨ ชื่อ
================================ */

h1 {

    font-size:
        clamp(42px, 8vw, 75px);

    margin:
        25px 0 5px;

    color: #ff2997;

    letter-spacing: 3px;

    text-shadow:

        3px 3px white,

        0 0 20px
        rgba(255,30,150,.5);
}


.name {

    font-size: 28px;

    font-weight: bold;

    color: #00a99e;

    text-shadow:
        1px 1px white;
}


.tagline {

    margin-top: 12px;

    color: #80506f;

    font-size: 18px;
}


/* ================================
   📚 เมนู
================================ */

.menu {

    margin-top: 45px;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px, 1fr)
        );

    gap: 18px;
}


.menu a {

    position: relative;

    padding: 24px 15px;

    border-radius: 28px;

    text-decoration: none;

    background:
        linear-gradient(
            135deg,
            #ff3f9f,
            #ff78bd
        );

    color: white;

    font-weight: bold;

    box-shadow:
        0 10px 25px
        rgba(255,30,150,.25);

    overflow: hidden;

    transition:
        .35s;
}


.menu a:nth-child(even) {

    background:
        linear-gradient(
            135deg,
            #00bfb3,
            #00e4d1
        );

    box-shadow:
        0 10px 25px
        rgba(0,180,170,.3);
}


.menu a:hover {

    transform:
        translateY(-10px)
        scale(1.04);

    box-shadow:

        0 20px 35px
        rgba(255,255,255,.4);
}


.menu-icon {

    display: block;

    font-size: 35px;

    margin-bottom: 8px;
}


.menu-title {

    font-size: 18px;
}


.menu-small {

    display: block;

    margin-top: 5px;

    opacity: .8;

    font-size: 13px;
}


/* ================================
   📱 Mobile
================================ */

@media(max-width:600px) {

    .cover {
        padding: 40px 18px;
    }

    .photo-frame img {
        width: 160px;
        height: 160px;
    }

    .menu {
        grid-template-columns: 1fr;
    }

}

</style>
