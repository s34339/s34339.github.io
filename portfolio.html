<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio | Arisara Saetang</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
min-height:100vh;
color:#3f5a35;
background:
radial-gradient(circle at 15% 30%,rgba(255,214,236,.55),transparent 30%),
radial-gradient(circle at 85% 20%,rgba(200,240,170,.55),transparent 32%),
linear-gradient(180deg,#fff6e9,#ffe9f2 30%,#eafcd8 65%,#bdeeae);
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 2px);
background-size:80px 80px;
animation:sparkle 8s linear infinite;
}

@keyframes sparkle{
from{background-position:0 0}
to{background-position:80px 80px}
}

.garden-sun{
position:fixed;
width:220px;height:220px;
top:-80px;right:-60px;
border-radius:50%;
background:radial-gradient(circle,#fff6c8,#ffe98a,transparent 75%);
box-shadow:0 0 60px rgba(255,222,120,.55);
animation:sunPulse 6s infinite;
}

@keyframes sunPulse{
50%{transform:scale(1.08);opacity:1}
}

.garden-grass{
position:fixed;
bottom:0;left:0;right:0;
height:55px;
background:repeating-linear-gradient(75deg,#9fdb7a 0 10px,#b6e893 10px 20px);
opacity:.5;
}

.floaty{
position:fixed;
font-size:30px;
z-index:2;
animation:float 7s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-35px)}
}

.page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:30px 20px;
position:relative;
z-index:5;
}

.card{
width:min(1050px,94%);
padding:55px 35px;
text-align:center;
background:rgba(255,255,255,.94);
border:4px solid white;
border-radius:55px;
box-shadow:0 30px 80px rgba(120,150,80,.3),0 0 45px white;
animation:cardGlow 3s infinite;
}

@keyframes cardGlow{
50%{box-shadow:0 30px 90px rgba(120,150,80,.35),0 0 70px #ffd6ec}
}

.photo{
display:inline-block;
padding:10px;
border-radius:50%;
background:linear-gradient(135deg,#ffd6ec,#c9eda0,#ffd6ec);
box-shadow:0 0 35px #ffc6e6;
}

.photo img{
width:210px;
height:210px;
object-fit:cover;
border-radius:50%;
border:7px solid white;
}

h1{
font-size:clamp(45px,8vw,75px);
margin:25px 0 5px;
color:#ff8fc2;
letter-spacing:3px;
text-shadow:3px 3px white;
}

.name{
font-size:28px;
font-weight:bold;
color:#5a9a45;
}

.badge{
display:inline-block;
margin-top:10px;
padding:7px 20px;
border:2px dashed #ffb6d9;
border-radius:20px;
color:#ff6fb5;
font-weight:bold;
background:white;
}

.tagline{
margin-top:15px;
font-size:18px;
line-height:1.8;
}

.menu{
margin-top:45px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
gap:18px;
}

.menu a{
padding:24px 12px;
text-decoration:none;
color:#3f6b3a;
border-radius:28px;
font-weight:bold;
background:linear-gradient(135deg,#ffb3d9,#ffe3f0,#c9eda0);
box-shadow:0 10px 25px rgba(255,180,220,.45);
transition:.3s;
}

.menu a:nth-child(even){
background:linear-gradient(135deg,#cdeeae,#eefbdc,#ffd6ec);
}

.menu a:hover{
transform:translateY(-10px) scale(1.04);
}

.icon{
display:block;
font-size:35px;
margin-bottom:8px;
}

.small{
display:block;
font-size:12px;
margin-top:5px;
}

@media(max-width:600px){
.card{padding:45px 18px}
.photo img{width:165px;height:165px}
.menu{grid-template-columns:1fr}
}
</style>
</head>

<body>

</div>

</a>

</nav>

</div>
</main>

</html>
