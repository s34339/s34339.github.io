<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* =====================================================
   🌊 RESET
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: Tahoma, Arial, sans-serif;

    overflow-x: hidden;

    color: white;

    /* 🌊 พื้นทะเลจริง ๆ */
    background:

        radial-gradient(
            ellipse at 50% -10%,
            rgba(255,255,255,.75),
            transparent 35%
        ),

        radial-gradient(
            circle at 20% 35%,
            rgba(0,255,235,.20),
            transparent 25%
        ),

        radial-gradient(
            circle at 80% 55%,
            rgba(0,180,255,.20),
            transparent 30%
        ),

        linear-gradient(
            180deg,
            #087f91 0%,
            #056b83 25%,
            #04566f 55%,
            #033d5c 78%,
            #022c49 100%
        );

    position: relative;
}


/* =====================================================
   ☀️ แสงส่องลงใต้น้ำ
===================================================== */

body::before {

    content: "";

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 0;

    opacity: .55;

    background:

        linear-gradient(
            110deg,
            transparent 20%,
            rgba(255,255,255,.13) 30%,
            transparent 40%
        ),

        linear-gradient(
            70deg,
            transparent 35%,
            rgba(255,255,255,.10) 45%,
            transparent 55%
        );

    animation: sunlight 8s ease-in-out infinite alternate;
}

@keyframes sunlight {

    0% {
        transform: translateX(-30px);
        opacity: .35;
    }

    100% {
        transform: translateX(30px);
        opacity: .7;
    }
}


/* =====================================================
   ✨ กลิตเตอร์ทั่วทะเล
===================================================== */

.glitter {

    position: fixed;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    z-index: 2;

    pointer-events: none;

    box-shadow:
        0 0 5px white,
        0 0 12px #8ffff5;

    animation:
        glitterMove 4s ease-in-out infinite,
        glitterBlink 1.5s ease-in-out infinite alternate;
}


@keyframes glitterMove {

    0% {
        transform:
            translateY(20px);
    }

    50% {
        transform:
            translateY(-40px);
    }

    100% {
        transform:
            translateY(20px);
    }
}


@keyframes glitterBlink {

    0% {
        opacity: .2;
        transform: scale(.5);
    }

    100% {
        opacity: 1;
        transform: scale(1.5);
    }
}


/* ตำแหน่งกลิตเตอร์ */

.g1  { left: 5%;  top: 18%; }
.g2  { left: 11%; top: 42%; animation-delay: .3s; }
.g3  { left: 18%; top: 25%; animation-delay: .8s; }
.g4  { left: 25%; top: 70%; animation-delay: 1.2s; }
.g5  { left: 32%; top: 35%; animation-delay: .5s; }
.g6  { left: 39%; top: 82%; animation-delay: 1.7s; }
.g7  { left: 46%; top: 20%; animation-delay: .9s; }
.g8  { left: 52%; top: 55%; animation-delay: 1.4s; }
.g9  { left: 59%; top: 30%; animation-delay: .2s; }
.g10 { left: 66%; top: 75%; animation-delay: 1.8s; }
.g11 { left: 73%; top: 18%; animation-delay: .7s; }
.g12 { left: 79%; top: 48%; animation-delay: 1.3s; }
.g13 { left: 86%; top: 30%; animation-delay: .4s; }
.g14 { left: 92%; top: 65%; animation-delay: 1.6s; }
.g15 { left: 15%; top: 88%; animation-delay: 2s; }
.g16 { left: 88%; top: 88%; animation-delay: .6s; }


/* =====================================================
   💎 เพชร
===================================================== */

.diamond {

    position: fixed;

    width: 22px;
    height: 22px;

    transform: rotate(45deg);

    background:

        linear-gradient(
            135deg,
            white 0%,
            #7ffff2 25%,
            white 45%,
            #ff73bb 65%,
            white 100%
        );

    border-radius: 4px;

    z-index: 3;

    pointer-events: none;

    box-shadow:

        0 0 8px white,
        0 0 18px #5ffff2,
        0 0 35px #ff5db0;

    animation:
        diamondFloat 6s ease-in-out infinite,
        diamondGlow 2s ease-in-out infinite alternate;
}


.diamond.small {

    width: 12px;
    height: 12px;

}


.diamond.big {

    width: 32px;
    height: 32px;

}


@keyframes diamondFloat {

    0% {
        transform:
            translateY(30px)
            rotate(45deg);
    }

    50% {
        transform:
            translateY(-70px)
            rotate(135deg);
    }

    100% {
        transform:
            translateY(30px)
            rotate(225deg);
    }

}


@keyframes diamondGlow {

    from {
        opacity: .3;
        filter: brightness(.8);
    }

    to {
        opacity: 1;
        filter: brightness(1.8);
    }

}


.d1 {
    left: 6%;
    top: 20%;
}

.d2 {
    left: 18%;
    top: 70%;
    animation-delay: 1s;
}

.d3 {
    left: 30%;
    top: 15%;
    animation-delay: 2s;
}

.d4 {
    right: 8%;
    top: 20%;
    animation-delay: 1.5s;
}

.d5 {
    right: 17%;
    top: 65%;
    animation-delay: 3s;
}

.d6 {
    left: 50%;
    top: 80%;
    animation-delay: 2.5s;
}


/* =====================================================
   🫧 ฟองอากาศ
===================================================== */

.bubble {

    position: fixed;

    bottom: -60px;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    border:
        2px solid rgba(255,255,255,.65);

    background:
        rgba(255,255,255,.08);

    z-index: 2;

    pointer-events: none;

    box-shadow:
        inset 2px 2px 5px white;

    animation:
        bubbleUp 9s linear infinite;
}


@keyframes bubbleUp {

    0% {
        transform:
            translateY(0)
            translateX(0);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    50% {
        transform:
            translateY(-50vh)
            translateX(35px);
    }

    100% {
        transform:
            translateY(-115vh)
            translateX(-30px);

        opacity: 0;
    }
}


.b1 { left: 7%; animation-delay: 0s; }
.b2 { left: 20%; animation-delay: 3s; width: 12px; height: 12px; }
.b3 { left: 35%; animation-delay: 5s; width: 28px; height: 28px; }
.b4 { left: 55%; animation-delay: 2s; }
.b5 { left: 70%; animation-delay: 6s; width: 13px; height: 13px; }
.b6 { left: 85%; animation-delay: 4s; width: 25px; height: 25px; }


/* =====================================================
   🌊 คลื่นด้านล่าง
===================================================== */

.wave {

    position: fixed;

    left: -15%;

    bottom: -120px;

    width: 130%;

    height: 300px;

    border-radius:
        50% 50% 0 0;

    z-index: 4;

    pointer-events: none;

    background:

        linear-gradient(
            180deg,
            rgba(75,255,239,.45),
            rgba(0,120,150,.7)
        );

    box-shadow:
        0 -20px 50px
        rgba(75,255,239,.35);

    animation:
        waveMove 5s ease-in-out infinite;
}


.wave.two {

    bottom: -155px;

    height: 320px;

    opacity: .7;

    background:

        linear-gradient(
            180deg,
            rgba(255,80,180,.35),
            rgba(0,150,160,.6)
        );

    animation:
        waveMove 7s ease-in-out infinite reverse;
}


.wave.three {

    bottom: -200px;

    height: 350px;

    opacity: .45;

    background:
        rgba(0,210,205,.6);

    animation:
        waveMove 9s ease-in-out infinite;
}


@keyframes waveMove {

    0%,100% {
        transform:
            translateX(-5%)
            rotate(1deg);
    }

    50% {
        transform:
            translateX(5%)
            rotate(-2deg);
    }
}


/* =====================================================
   💎 กล่อง Portfolio
===================================================== */

.container {

    position: relative;

    z-index: 10;

    width:
        min(1050px, 92%);

    margin:
        45px auto 300px;
}


.cover {

    padding:
        60px 35px;

    min-height:
        700px;

    text-align:
        center;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.94),
            rgba(255,235,247,.90)
        );

    border:
        4px solid white;

    border-radius:
        60px;

    box-shadow:

        0 30px 80px
        rgba(0,20,50,.5),

        0 0 40px
        rgba(255,255,255,.5);

    backdrop-filter:
        blur(12px);
}


/* =====================================================
   🖼️ กรอบรูป
===================================================== */

.photo-frame {

    display: inline-block;

    padding: 10px;

    border-radius: 50%;

    /* กรอบเปลี่ยนสีได้
       แต่รูปข้างในไม่เปลี่ยนสี */
  
    box-shadow:

        0 0 15px white,
        0 0 35px #ff3da5,
        0 0 55px #00ffe1;

    animation:
        frameGlow 5s linear infinite;
}


@keyframes frameGlow {

    100% {
        filter:
            hue-rotate(360deg);
    }
}


/* =====================================================
   ⭐ สำคัญมาก
   รูปไม่ถูก filter ไม่ถูก hue-rotate
===================================================== */

.photo-frame img {

    display: block;

    width: 210px;
    height: 210px;

    object-fit: cover;

    border-radius: 50%;

    border:
        7px solid white;

    /* ไม่ใส่ filter ใด ๆ */

    filter: none !important;

    animation: none !important;

}


/* =====================================================
   💗 ตัวหนังสือ
===================================================== */

h1 {

    margin:
        25px 0 5px;

    font-size:
        clamp(42px, 8vw, 75px);

    color:
        #ff2998;

    letter-spacing:
        3px;

    text-shadow:

        3px 3px white,

        0 0 20px
        rgba(255,40,150,.6);
}


.name {

    font-size:
        28px;

    font-weight:
        bold;

    color:
        #00a99e;
}


.tagline {

    margin-top:
        12px;

    font-size:
        18px;

    line-height:
        1.8;

    color:
        #76506e;
}


/* =====================================================
   📚 เมนู
===================================================== */

.menu {

    margin-top:
        45px;

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px, 1fr)
        );

    gap:
        18px;
}


.menu a {

    padding:
        25px 15px;

    text-decoration:
        none;

    color:
        white;

    border-radius:
        28px;

    font-weight:
        bold;

    background:

        linear-gradient(
            135deg,
            #ff238f,
            #ff63b0
        );

    box-shadow:

        0 10px 25px
        rgba(255,30,145,.4);

    transition:
        .35s;

}


.menu a:nth-child(even) {

    background:

        linear-gradient(
            135deg,
            #00a99d,
            #00e0ce
        );

    box-shadow:

        0 10px 25px
        rgba(0,200,185,.4);
}


.menu a:hover {

    transform:
        translateY(-10px)
        scale(1.04);

    box-shadow:

        0 20px 40px
        rgba(255,255,255,.4);
}


.menu-icon {

    display:
        block;

    font-size:
        36px;

    margin-bottom:
        8px;
}


.menu-title {

    font-size:
        18px;
}


.menu-small {

    display:
        block;

    margin-top:
        6px;

    font-size:
        12px;

    opacity:
        .85;
}


/* =====================================================
   📱 โทรศัพท์
===================================================== */

@media(max-width:600px) {

    .cover {
        padding:
            45px 18px;
    }

    .photo-frame img {

        width: 165px;
        height: 165px;

    }

    .menu {

        grid-template-columns:
            1fr;

    }

}

</style>
