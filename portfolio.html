<style>

/* =====================================================
   🌊 RESET
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Tahoma, Arial, sans-serif;

    overflow-x: hidden;

    color: white;

    /* 🩵 ทะเลสีฟ้าเทอร์ควอยซ์ */
    background:
        radial-gradient(
            ellipse at 50% -10%,
            rgba(255,255,255,.8),
            transparent 35%
        ),

        radial-gradient(
            circle at 15% 35%,
            rgba(0,255,240,.25),
            transparent 25%
        ),

        radial-gradient(
            circle at 85% 55%,
            rgba(0,220,255,.25),
            transparent 30%
        ),

        linear-gradient(
            180deg,
            #00aeb5 0%,
            #008fa5 25%,
            #00758e 50%,
            #005a78 75%,
            #003e61 100%
        );

    position: relative;
}


/* =====================================================
   ☀️ แสงใต้น้ำ
===================================================== */

body::before {
    content: "";

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 0;

    opacity: .6;

    background:

        linear-gradient(
            110deg,
            transparent 15%,
            rgba(255,255,255,.16) 30%,
            transparent 42%
        ),

        linear-gradient(
            70deg,
            transparent 30%,
            rgba(255,255,255,.12) 45%,
            transparent 58%
        ),

        linear-gradient(
            100deg,
            transparent 50%,
            rgba(0,255,240,.12) 65%,
            transparent 78%
        );

    background-size:
        250% 100%,
        220% 100%,
        250% 100%;

    animation:
        sunlight 10s ease-in-out infinite alternate;
}


@keyframes sunlight {

    0% {
        transform: translateX(-50px);
        opacity: .3;
    }

    50% {
        transform: translateX(20px);
        opacity: .6;
    }

    100% {
        transform: translateX(60px);
        opacity: .8;
    }
}


/* =====================================================
   ✨ กลิตเตอร์
===================================================== */

.glitter {
    position: fixed;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    z-index: 2;

    pointer-events: none;

    box-shadow:
        0 0 5px white,
        0 0 12px #8fffff,
        0 0 20px #00fff0;

    animation:
        glitterMove 4s ease-in-out infinite,
        glitterBlink 1.5s ease-in-out infinite alternate;
}


@keyframes glitterMove {

    0% {
        transform: translateY(20px);
    }

    50% {
        transform: translateY(-40px);
    }

    100% {
        transform: translateY(20px);
    }
}


@keyframes glitterBlink {

    0% {
        opacity: .2;
        transform: scale(.5);
    }

    100% {
        opacity: 1;
        transform: scale(1.5);
    }
}


.g1  { left: 5%;  top: 18%; }
.g2  { left: 11%; top: 42%; animation-delay: .3s; }
.g3  { left: 18%; top: 25%; animation-delay: .8s; }
.g4  { left: 25%; top: 70%; animation-delay: 1.2s; }
.g5  { left: 32%; top: 35%; animation-delay: .5s; }
.g6  { left: 39%; top: 82%; animation-delay: 1.7s; }
.g7  { left: 46%; top: 20%; animation-delay: .9s; }
.g8  { left: 52%; top: 55%; animation-delay: 1.4s; }
.g9  { left: 59%; top: 30%; animation-delay: .2s; }
.g10 { left: 66%; top: 75%; animation-delay: 1.8s; }
.g11 { left: 73%; top: 18%; animation-delay: .7s; }
.g12 { left: 79%; top: 48%; animation-delay: 1.3s; }
.g13 { left: 86%; top: 30%; animation-delay: .4s; }
.g14 { left: 92%; top: 65%; animation-delay: 1.6s; }
.g15 { left: 15%; top: 88%; animation-delay: 2s; }
.g16 { left: 88%; top: 88%; animation-delay: .6s; }


/* =====================================================
   💎 เพชรสีฟ้า
===================================================== */

.diamond {
    position: fixed;

    width: 22px;
    height: 22px;

    transform: rotate(45deg);

    background:
        linear-gradient(
            135deg,
            white 0%,
            #9fffff 25%,
            #00ffe1 45%,
            white 65%,
            #52dfff 85%,
            white 100%
        );

    border-radius: 4px;

    z-index: 3;

    pointer-events: none;

    box-shadow:
        0 0 8px white,
        0 0 18px #00fff0,
        0 0 35px #4defff;

    animation:
        diamondFloat 6s ease-in-out infinite,
        diamondGlow 2s ease-in-out infinite alternate;
}


.diamond.small {
    width: 12px;
    height: 12px;
}


.diamond.big {
    width: 32px;
    height: 32px;
}


@keyframes diamondFloat {

    0% {
        transform:
            translateY(30px)
            rotate(45deg);
    }

    50% {
        transform:
            translateY(-70px)
            rotate(135deg);
    }

    100% {
        transform:
            translateY(30px)
            rotate(225deg);
    }
}


@keyframes diamondGlow {

    from {
        opacity: .3;
        filter: brightness(.8);
    }

    to {
        opacity: 1;
        filter: brightness(1.8);
    }
}


.d1 {
    left: 6%;
    top: 20%;
}

.d2 {
    left: 18%;
    top: 70%;
    animation-delay: 1s;
}

.d3 {
    left: 30%;
    top: 15%;
    animation-delay: 2s;
}

.d4 {
    right: 8%;
    top: 20%;
    animation-delay: 1.5s;
}

.d5 {
    right: 17%;
    top: 65%;
    animation-delay: 3s;
}

.d6 {
    left: 50%;
    top: 80%;
    animation-delay: 2.5s;
}


/* =====================================================
   🫧 ฟองอากาศ
===================================================== */

.bubble {
    position: fixed;

    bottom: -60px;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    border:
        2px solid rgba(255,255,255,.7);

    background:
        rgba(255,255,255,.08);

    z-index: 2;

    pointer-events: none;

    box-shadow:
        inset 2px 2px 5px white,
        0 0 10px rgba(120,255,255,.5);

    animation:
        bubbleUp 9s linear infinite;
}


@keyframes bubbleUp {

    0% {
        transform:
            translateY(0)
            translateX(0)
            scale(.7);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    50% {
        transform:
            translateY(-50vh)
            translateX(35px)
            scale(1);
    }

    100% {
        transform:
            translateY(-115vh)
            translateX(-30px)
            scale(1.2);

        opacity: 0;
    }
}


.b1 {
    left: 7%;
    animation-delay: 0s;
}

.b2 {
    left: 20%;
    animation-delay: 3s;
    width: 12px;
    height: 12px;
}

.b3 {
    left: 35%;
    animation-delay: 5s;
    width: 28px;
    height: 28px;
}

.b4 {
    left: 55%;
    animation-delay: 2s;
}

.b5 {
    left: 70%;
    animation-delay: 6s;
    width: 13px;
    height: 13px;
}

.b6 {
    left: 85%;
    animation-delay: 4s;
    width: 25px;
    height: 25px;
}


/* =====================================================
   🌊 คลื่นด้านล่าง
===================================================== */

.wave {
    position: fixed;

    left: -15%;
    bottom: -120px;

    width: 130%;
    height: 300px;

    border-radius:
        50% 50% 0 0;

    z-index: 4;

    pointer-events: none;

    background:
        linear-gradient(
            180deg,
            rgba(50,255,240,.5),
            rgba(0,150,180,.75)
        );

    box-shadow:
        0 -20px 50px
        rgba(0,255,240,.35);

    animation:
        waveMove 5s ease-in-out infinite;
}


.wave.two {
    bottom: -155px;

    height: 320px;

    opacity: .7;

    background:
        linear-gradient(
            180deg,
            rgba(0,255,240,.4),
            rgba(0,120,170,.65)
        );

    animation:
        waveMove 7s ease-in-out infinite reverse;
}


.wave.three {
    bottom: -200px;

    height: 350px;

    opacity: .45;

    background:
        rgba(0,220,220,.6);

    animation:
        waveMove 9s ease-in-out infinite;
}


@keyframes waveMove {

    0%,100% {
        transform:
            translateX(-5%)
            rotate(1deg);
    }

    50% {
        transform:
            translateX(5%)
            rotate(-2deg);
    }
}


/* =====================================================
   💎 กล่อง Portfolio
===================================================== */

.container {
    position: relative;

    z-index: 10;

    width:

    margin:

        4px solid white;

    border-radius:
        60px;

        0 30px 80px

        rgba(255,255,255,.5);

    backdrop-filter:
        blur(12px);
}

   🖼️ กรอบรูป
===================================================== */

.photo-frame {

    display: inline-block;

    padding: 10px;

    border-radius: 50%;

    background:
       
    background-size: 300% 300%;

    box-shadow:
        0 0 15px white,
        0 0 35px #00ffe1,
        0 0 55px rgba(0,180,255,.7);

    animation:
        frameLight 4s ease infinite;
}



@keyframes frameLight {

    0% {
        background-position: 0% 50%;
        box-shadow:
            0 0 15px white,
            0 0 30px #00ffe1;
    }

    50% {
        background-position: 100% 50%;
        box-shadow:
            0 0 20px white,
            0 0 45px #00bfff;
    }

    100% {
        background-position: 0% 50%;
        box-shadow:
            0 0 15px white,
            0 0 30px #00ffe1;
    }
}


.photo-frame img {

    display: block;

    width: 210px;
    height: 210px;

    object-fit: cover;

    border-radius: 50%;

    border:
        7px solid white;

    filter: none !important;

    animation: none !important;

    transform: none !important;

    transition: none !important;
}


/* =====================================================
   💗 ตัวหนังสือ
===================================================== */

    margin:

/* =====================================================

===================================================== */

.menu {

    margin-top:
        45px;

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px, 1fr)

    gap:

}


.menu a {

    padding:
        25px 15px;

    text-decoration:
        none;

    color:
        white;

    border-radius:
        28px;

    font-weight:
        bold;

    background:
        linear-gradient(
            135deg,
            #00aeb5,
            #00e5d4,
            #00a9e8
        );

    background-size:
        200% 200%;

    box-shadow:
        0 10px 25px
        rgba(0,200,210,.45);

    transition:
        .35s;

    animation:
        menuShine 5s ease infinite;
}


@keyframes menuShine {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


.menu a:nth-child(even) {

    background:
        linear-gradient(
            135deg,
            #008fc4,
            #00c9d8,
            #00e5d4
        );

    background-size:
        200% 200%;

    box-shadow:
        0 10px 25px
        rgba(0,180,230,.45);
}


.menu a:hover {

    transform:
        translateY(-10px)
        scale(1.04);

    box-shadow:
        0 20px 40px
        rgba(0,255,240,.55);
}


.menu-icon {

    display:
        block;

    font-size:
        36px;

    margin-bottom:
        8px;

.menu-title {

        18px;

.menu-small {

/* =====================================================
   📱 โทรศัพท์
===================================================== */

@media(max-width:600px) {

    }

        height: 165px;

    }

    .menu {

        grid-template-columns:
            1fr;

    }

}
