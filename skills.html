<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทักษะความสามารถ - PORTFOLIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="stlye.css">
    <style>
        .skill-item {
            margin-bottom: 22px;
        }
        .skill-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .skill-name {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
        }
        .skill-percentage {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
            font-family: 'Cinzel', 'Prompt', sans-serif;
        }
        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(140, 36, 67, 0.08);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(140, 36, 67, 0.05);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold), var(--primary));
            border-radius: 10px;
            transition: width 1s ease-in-out;
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <header>
        <a href="index.html" class="brand-logo">PORTFOLIO</a>
        <a href="portfolio.html" class="action-btn">สารบัญผลงาน</a>
    </header>

    <div class="main-wrapper">
        <div class="page-container">
            <a href="portfolio.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> ย้อนกลับหน้าสารบัญ</a>
            
            <div class="content-card-box">
                <h2 style="color: var(--primary); margin-bottom: 25px; font-size: 1.6rem;">ทักษะและความสามารถ (Skills & Abilities)</h2>
                
                <div style="display: flex; flex-direction: column; gap: 4px;">

                    <!-- ภาวะผู้นำ -->
                    <div class="skill-item">
                        <div class="skill-info">
                            <span class="skill-name"><i class="fa-solid fa-user-tie" style="color: var(--primary); margin-right: 8px;"></i>ภาวะผู้นำ</span>
                            <span class="skill-percentage">90%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-fill" style="width: 90%;"></div>
                        </div>
                    </div>

                    <!-- ช่วยเหลือผู้อื่น -->
                    <div class="skill-item">
                        <div class="skill-info">
                            <span class="skill-name"><i class="fa-solid fa-hand-holding-heart" style="color: var(--primary); margin-right: 8px;"></i>จิตอาสาและการช่วยเหลือผู้อื่น</span>
                            <span class="skill-percentage">90%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-fill" style="width: 90%;"></div>
                        </div>
                    </div>

                    <!-- ความสามารถทางคณิตศาสตร์ -->
                    <div class="skill-item">
                        <div class="skill-info">
                            <span class="skill-name"><i class="fa-solid fa-calculator" style="color: var(--primary); margin-right: 8px;"></i>ความสามารถทางคณิตศาสตร์</span>
                            <span class="skill-percentage">80%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-fill" style="width: 80%;"></div>
                        </div>
                    </div>

                    <!-- ด้านการสื่อสารภาษาอังกฤษ -->
                    <div class="skill-item">
                        <div class="skill-info">
                            <span class="skill-name"><i class="fa-solid fa-language" style="color: var(--primary); margin-right: 8px;"></i>ความสามารถด้านการสื่อสารภาษาอังกฤษ</span>
                            <span class="skill-percentage">70%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-fill" style="width: 70%;"></div>
                        </div>
                    </div>

                    <!-- ความรู้ด้านการบริหาร -->
                    <div class="skill-item">
                        <div class="skill-info">
                            <span class="skill-name"><i class="fa-solid fa-chart-line" style="color: var(--primary); margin-right: 8px;"></i>ความรู้ด้านการบริหารจัดการ</span>
                            <span class="skill-percentage">70%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-fill" style="width: 70%;"></div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        class Particle {
            constructor() { this.reset(); }
            reset() { this.x = Math.random() * canvas.width; this.y = canvas.height + Math.random() * 100; this.radius = Math.random() * 2.5 + 1; this.speedY = Math.random() * 0.4 + 0.15; this.alpha = Math.random() * 0.5 + 0.2; }
            update() { this.y -= this.speedY; if (this.y < -10) this.reset(); }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`; ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(197, 160, 89, 0.4)'; ctx.fill(); }
        }
        for (let i = 0; i < 45; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        animate();
    </script>
</body>
</html>
